            boolean:
    

    # Input: Response Handling
    ##############################
    response_handling:
      name: "Response Handling"
      icon: mdi:message-reply
      collapsed: true
      description: >-
        <br>
        **Multi-Device Response Control** - Configure how responses are handled when notifying multiple devices.
        <br><br>
        **Use Cases:**<br>
         - Family alert: First person to respond wins, others auto-dismissed<br>
         - Chore acceptance: One person claims task, notify others it's taken<br>
         - Critical alerts: Ensure visibility by keeping notification on other devices<br><br>
        **📘 Note**: Single-device notifications ignore these settings (only relevant for multiple targets).
        
      input:
        response_mode:
          name: "🎯 Response Mode"
          description: >-
            Controls whether multiple devices can respond or only the first response is processed.<br><br>
            **Single Response** (Default):<br>
             - ✅ Only the first device's response is processed<br>
             - ✅ Subsequent responses from other devices are ignored<br>
             - ✅ Best for "first to claim" scenarios (unlock door, accept chore)<br>
             - ✅ Options below control what happens to non-responding devices<br><br>
            **Multi Response**:<br>
             - ✅ Every device can respond independently<br>
             - ✅ All responses are processed separately<br>
             - ✅ Best when each person needs to take action (confirm attendance, rate service)<br>
             - ⚠️ Options below are ignored in this mode<br><br>
            💡 **Single device notifications**: Both modes behave identically.<br><br>
            Default: Single Response
          default: "single"
          selector:
            select:
              options:
                - label: "Single Response (First Wins)"
                  value: "single"
                - label: "Multi Response (All Can Respond)"
                  value: "multi"
        clear_other_notifications:
          name: "🧹 Auto-Clear Other Devices"
          description: >-
            **⚙️ Single Response Mode Only** - When first device responds, automatically dismiss notifications on all other devices.<br><br>
            **How it works:**<br>
             - Device A responds → notifications on devices B, C, D are cleared<br>
             - Only applies to devices that haven't responded yet<br>
             - Works in conjunction with "Notify Other Devices" below<br><br>
            **Use case:** Family alert - Mom responds to unlock door, notification auto-clears from Dad's and kids' phones.<br><br>
            **🍎 iOS**: Reliable clearing support<br>
            **🤖 Android**: Limited - may require user to manually clear in some cases<br><br>
            ⚠️ **Ignored in Multi Response mode**<br><br>
            Default: Enabled
          default: true
          selector:
            boolean:
        notify_other_devices_on_response:
          name: "📢 Notify Other Devices on Response"
          description: >-
            **⚙️ Single Response Mode Only** - Send informational notification to other devices when first device responds.<br><br>
            **How it works:**<br>
             - Device A responds → new notification sent to devices B, C, D<br>
             - Original notification may be cleared (see "Auto-Clear" above)<br>
             - New notification shows who responded and which action they took<br>
             - Message content customizable via template below<br><br>
            **Use case:** "Front door unlocked by John's iPhone" sent to other family members for awareness.<br><br>
            **💡 Tip**: Combine with "Auto-Clear" for best user experience (remove old, show new).<br><br>
            ⚠️ **Ignored in Multi Response mode**<br><br>
            Default: Disabled
          default: false
          selector:
            boolean:
        other_devices_message_template:
          name: "💬 Other Devices Message Template"
          description: >-
            **📝 Requires "Notify Other Devices" enabled** - Customize the message sent to non-responding devices. Supports Jinja2 templates.<br><br>
            **Available Template Variables:**<br>
             - `responding_device_name` - Name of the device that responded (e.g., "John's iPhone")<br>
             - `selected_action` - Which action button was pressed (e.g., "option_one", "option_two")<br>
             - `original_message` - The original notification message text<br>
             - `action_label` - Human-readable label of the selected action button<br>
             - Standard HA variables: `now()`, `states()`, etc.<br><br>
            **Template Examples:**<br>
             - **Simple**: `Action handled by {{ responding_device_name }}`<br>
             - **With action**: `{{ responding_device_name }} pressed "{{ action_label }}"`<br>
             - **Detailed**: `{{ original_message }} - {{ selected_action }} by {{ responding_device_name }}`<br>
             - **Time-stamped**: `Handled by {{ responding_device_name }} at {{ now().strftime('%H:%M') }}`<br><br>
            **📘 Note**: Template errors fall back to default message.<br><br>
            ⚠️ **Ignored in Multi Response mode**<br><br>
            Default: "Action handled by {{ responding_device_name | default('another device') }}"
          default: "Action handled by {{ responding_device_name | default('another device') }}"
          selector:
            text:
              multiline: true
        run_actions_for_others_on_response:
          name: "⚙️ Run Actions for Other Devices"
          description: >-
            **⚙️ Single Response Mode Only** - Execute custom actions for devices that didn't respond when first device responds.<br><br>
            **How it works:**<br>
             - Device A responds → actions run once for each device (B, C, D) that didn't respond<br>
             - Useful for logging, tracking, or follow-up automation<br>
             - Actions defined in "Actions for Other Devices" below<br><br>
            **Use Cases:**<br>
             - Log which devices were notified but didn't respond<br>
             - Update dashboard showing who hasn't acknowledged<br>
             - Send reminder to specific devices after timeout<br>
             - Track response rates for analytics<br><br>
            **💡 Tip**: Combine with timeout actions for comprehensive tracking.<br><br>
            ⚠️ **Ignored in Multi Response mode**<br><br>
            Default: Disabled
          default: false
          selector:
            boolean:
        other_devices_actions:
          name: "⚙️ Actions for Other Devices"
          description: >-
            **📝 Requires "Run Actions for Others" enabled** - Define actions to execute for each non-responding device.<br><br>
            **Available Template Variables:**<br>
             - `responding_device_name` - Device that responded first<br>
             - `selected_action` - Which action button was pressed<br>
             - `notified_devices` - List of all device names that were notified<br>
             - `non_responding_device` - Current device in the loop (use in templates)<br>
             - `action_label` - Human-readable label of selected action<br><br>
            **Action Examples:**<br><br>
            **Log to history:**<br>
            ```yaml<br>
            - service: logbook.log<br>
              data:<br>
                name: "Notification Response"<br>
                message: "{{ non_responding_device }} did not respond. Handled by {{ responding_device_name }}"<br>
            ```<br><br>
            **Update input boolean:**<br>
            ```yaml<br>
            - service: input_boolean.turn_on<br>
              target:<br>
                entity_id: input_boolean.{{ non_responding_device | slugify }}_missed_alert<br>
            ```<br><br>
            **Send follow-up notification:**<br>
            ```yaml<br>
            - service: notify.mobile_app_{{ non_responding_device | slugify }}<br>
              data:<br>
                message: "Alert was handled by {{ responding_device_name }}"<br>
            ```<br><br>
            ⚠️ **Ignored in Multi Response mode**<br><br>
            `Optional`
          default: []
          selector:
            action:
    

    ##############################
    # Input: Timeout Response Handling
    ##############################

    timeout_configuration:
      name: "Timeout Configuration"
      icon: mdi:timer-cog-outline
      collapsed: true
      description: >-
        <br>
        **Timeout Settings** - Control how long to wait for user response and what happens when time expires.
        <br><br>

      input:
        enable_timeout:
          name: "⌛️ Enable Timeout"
          description: "Require script to stop listening after the set duration.<br><br>👍🏻 Recommended to enable.<br>⚠️ If disabled, script will wait for response indefinitely until the next time it is triggered."
          default: true # Default `true` for backward compatibility.
          selector:
            boolean:
        timeout:
          name: "⌛️ Timeout Duration"
          description: "How long to wait for user response before executing timeout actions.<br><br>**Use case:** Wait 5 minutes for response to door unlock request, 30 seconds for garage closing confirmation.<br><br>📖 [Actionable Notifications](https://companion.home-assistant.io/docs/notifications/actionable-notifications)<br><br>👍🏻 Recommended: ≥1 minute for reliable notification delivery<br>Default: 15 minutes"
          default:
            hours: 0
            minutes: 15
            seconds: 0
          selector:
            duration:
              enable_day: false
        run_timeout_actions:
          name: "⌛️ Enable Timeout Action(s)"
          description: "Run timeout actions upon a timeout event.<br><br>👍🏻 Recommended to enable.<br>⚠️ If disabled, script will timeout without executing any timeout actions."
          default: true # Default `true` for backward compatibility.
          selector:
            boolean:
        timeout_action:
          name: "⌛️ Timeout Action(s)"
          description: "Action to run when notification response is timed out.  \n\n❔ Leave empty if no actions should be run  \n\n⚠️ Android Users: Note, URI options do not stop the timeout countdown. This action could be run after pressing the URI option.\n❔ Android Users: Workaround for the above, you may disable `⌛️ Run timeout action(s) when notification cleared` and manually clear the notification after selecting your URI option. \n\n`Optional`"
          default: []
          selector:
            action:
        clear_behavior_on_timeout:
          name: "🧹 Clear notifications on timeout"
          selector:
            select:
              options:
                - label: "Keep all notifications visible"
                  value: "keep_all"
                - label: "Clear this device only"
                  value: "clear_this"
                - label: "Clear other devices (keep this one)"
                  value: "clear_others"
                - label: "Clear ALL devices"
                  value: "clear_all"
          default: "keep_all"
          description: >-
            What to do with notifications when timeout occurs.<br><br>
            🍎 **iOS**: Full support for all options<br>
            🤖 **Android**: Limited clearing support<br><br>
            **Multi-device only**: clear_others and clear_all<br><br>
            **Use cases:**<br>
            • Emergency alert expires → clear_all to remove from all phones<br>
            • Time-sensitive request → clear_this to clean up after timeout<br>
            • Multi-device coordination → clear_others to remove from non-responding devices
        notify_other_devices_on_timeout:
          name: "📢 Notify Other Devices on Timeout"
          description: >-
            **Multi-Device Only** - Send informational notification to all devices when timeout occurs.<br><br>
            **Example**: "Door unlock request timed out - no response received" sent to all family members.<br><br>
            Default: Disabled
          default: false
          selector:
            boolean:
        other_devices_timeout_message:
          name: "💬 Other Devices Timeout Message"
          description: >-
            **Requires "Notify Other Devices on Timeout" enabled** - Message sent when timeout occurs. Supports Jinja2 templates.<br><br>
            **Available variables:**<br>
             - `original_message`: The original notification message<br>
             - `timeout_seconds`: Duration of the timeout in seconds<br>
             - `notified_devices`: List of all notified device names<br><br>
            **Examples:**<br>
             - Simple: `No response received - request timed out`<br>
             - Detailed: `{{ original_message }} - Timed out after {{ timeout_seconds // 60 }} minutes`<br><br>
            Default: "No response received - timed out"
          default: "No response received - timed out"
          selector:
            text:
              multiline: true
        notify_other_devices_on_timeout:
      name: "Advanced Settings"
      icon: mdi:cog-outline
      collapsed: true
      description: >-
        <br>
        Configure notification link, tag, and grouping options.
        <br><br>

      input:
        notification_link:
          name: "🔗 Notification Link"
          description: "Link to navigate to upon clicking the notification. **Supports Jinja2 templates.**<br><br>**Examples:**<br> - Dashboard: `/lovelace/cameras` - View all cameras dashboard<br> - Dashboard: `/lovelace/security` - Security dashboard<br> - Entity view: `entityId:camera.front_door` - View front door camera<br> - Template: `/lovelace/{{ trigger.entity_id.split('.')[1] }}`<br> - Home Assistant views: `/config/updates` or `/lovelace/home`<br> - Apps: `app://<package name>`<br> - Deep links: `deep-link://<deep_link>`<br><br>See [documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic/#opening-a-url) for more information and options.<br><br>`Optional`"
          default: ""
          selector:
            text:
        ##############################
        # Input: Attachments
        ##############################
        tag:
          name: "🔖 Tag"
          description: "Used to uniquely identify the notification.  \n\nUse tag if you are using this script with other notification services.  \nLeave empty otherwise.  \n\nExample: `my_awesome_notification_for_device_X`  \n\n👍🏻 Recommended to leave empty\n\n`Optional`"
          default: ""
          selector:
            text:
        group:
          name: "📣 Notification Group ID"
          description: "Used for grouping different notifications together visually.  \n\n⚠️ iOS critical notifications do no support grouping.  \nSee [documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic?_highlight=tag#grouping) for more information.  \n\n`Optional`"
          default: ""
          selector:
            text:

    ios_settings:
      name: "iOS Specific Settings"
      icon: mdi:apple
      collapsed: true
      description: >-
        <br>
        iOS-only features like thread ID and presentation options.
        <br><br>

      input:
        thread_id:
          name: "🧵 Thread ID"
          description: "Groups notifications into conversation threads.<br><br>Example: `front-door-events` groups all front door alerts.<br><br>📖 [Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic#thread-id-grouping-notifications) | `Optional`"
          default: ""
          selector:
            text:
        presentation_options:
          name: "🎨 Presentation Options"
          description: "Controls what shows when app is open. Options: banner, sound, badge, list.<br><br>📖 [Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic#presentation-options) | `Optional`"
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: "Banner"
                  value: "banner"
                - label: "Sound"
                  value: "sound"
                - label: "Badge"
                  value: "badge"
                - label: "List"
                  value: "list"

    android_settings:
      name: "Android Specific Settings"
      icon: mdi:android
      collapsed: true
      description: >-
        <br>
        Android-only features like notification channels, LED colors, and vibration patterns.
        <br><br>

      input:
        channel:
          name: "📣 Notification Channel"
          description: "Defines the channel, to be used with Importance.  \nRelates to the importance of the notification.  \n\n`Optional`"
          default: "Home Assistant"
          selector:
            text:
        importance:
          name: "❕ Notification Channel Importance"
          description: "See [documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic/#notification-channel-importance) for more information."
          default: default
          selector:
            select:
              options:
                - label: "Urgent (Makes a sound with heads-up notification)"
                  value: high
                - label: "Default (Makes a sound)"
                  value: default
                - label: "Silent (Makes no sound)"
                  value: low
                - label: "Low (Makes no sound, doesn't appear in status bar)"
                  value: min
        android_high_priority:
          name: "❕ High Priority Mode"
          description: "Workaround to ensure notifications are delivered in timely fashion. This will override the Notification Channel Importance with `importance: high`, and set `ttl: 0`."
          default: true
          selector:
            boolean:
        visibility:
          name: "🔏 Notification Lockscreen Visibility"
          description: "Show or hide notification content on the lockscreen.  \nSee [documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic?_highlight=tag#notification-sensitivity--lock-screen-visibility) for more information.  \n\nDefault: `Private`"
          default: "private"
          selector:
            select:
              options:
                - label: "Public: Always show content."
                  value: public
                - label: "Private: Show content based on phone settings."
                  value: private
                - label: "Secret: Always hide content on the lockscreen."
                  value: secret


        persist:
          name: "🚩 Persistent Notification"
          description: "Prevents notifications from being swiped away by accident.  \n\n❔ This option blocks `⌛️ Run timeout action(s) when notification cleared`"
          default: false
          selector:
            boolean:
        ##############################
        # Input: Notification Link
        ##############################
        car_ui:
          name: "🚘 Show on Android Auto"
          description: "Display notification on Android Auto interface."
          default: false
          selector:
            boolean:
        sticky:
          name: "📌 Sticky"
          description: "Prevents notification from being dismissed until action buttons are used. Similar to persistent but stricter.<br><br>**Use case:** \"Water Leak Detected\" or \"Smoke Alarm\" notifications that require explicit acknowledgment.<br><br>📖 [Sticky Notifications](https://companion.home-assistant.io/docs/notifications/notifications-basic#sticky)<br><br>`Optional`"
          default: false
          selector:
            boolean:
        vibration_pattern:
          name: "📳 Vibration Pattern"
          description: "Custom vibration sequence in milliseconds. Helps identify notification type without looking at phone.<br><br>**Examples:**<br><br> - \"100,200,100,200\" - Quick double buzz for routine alerts<br> - \"0,500,200,500\" - Long-short-long for urgent alerts<br> - \"100,100,100,100,100,100\" - Rapid pulses for security<br><br>**Format:** wait,vibrate,wait,vibrate (in milliseconds)<br><br>📖 [Vibration Patterns](https://companion.home-assistant.io/docs/notifications/notifications-basic#notification-vibration-pattern)<br><br>`Optional`"
          default: ""
          selector:
            text:
        led_color:
          name: "💡 LED Color"
          description: "Notification LED color for devices with LED indicators. Provides visual notification when screen is off.<br><br>**Examples:**<br><br> - \"red\" - Critical/security alerts<br> - \"blue\" - Information/status updates<br> - \"#00FF00\" - Success/all-clear (hex green)<br> - \"orange\" - Warnings<br><br>**Use case:** Red LED for alarm triggers, blue for routine door alerts.<br><br>📖 [LED Color](https://companion.home-assistant.io/docs/notifications/notifications-basic#notification-led-color)<br><br>⚠️ Only works on devices with notification LED<br><br>`Optional`"
          default: ""
          selector:
            text:
        on_manual_clear_action:
          name: "🧹🤖 When notification swiped away (Android)"
          selector:
            select:
              options:
                - label: "Do nothing"
                  value: "do_nothing"
                - label: "Treat as timeout (run timeout actions)"
                  value: "treat_as_timeout"
                - label: "Run separate actions"
                  value: "run_custom"
          default: "do_nothing"
          description: >-
            **Android only** - What happens when user swipes notification away.<br><br>
            **Note**: Disabled if notification is persistent or sticky.<br><br>
            **Multi-device note**: In mixed iOS/Android setups, "treat as timeout" applies globally to all clear events.<br><br>
            `🤖 Android Only`
        clear_notification_actions:
          name: "⚙️🤖 Actions on manual clear"
          selector:
            action:
          default: []
          description: >-
            **Requires "Run separate actions" selected above** - Actions to run when notification is cleared.<br><br>
            **Available variables:**<br>
             - `user_response`: Contains response data including 'result': 'notification_cleared'<br>
             - `device_id`: ID of device that cleared the notification (if available)<br><br>
            **Example**: Log to history, update input_boolean, send analytics<br><br>
            `🤖 Android Only`<br><br>
            `Optional`
        alert_once:
          name: "🔕 Alert Once"
          description: "Play sound and vibrate only for initial notification, not for updates. Prevents notification spam for frequently updating alerts.<br><br>**Use case:** Motion sensor that updates every few seconds, or temperature alerts that change gradually.<br><br>📖 [Alert Once](https://companion.home-assistant.io/docs/notifications/notifications-basic#alert-once)<br><br>`Optional`"
          default: false
          selector:
            boolean:



