          name: "🍎 2️⃣ Icon"
          description: "Custom SF Symbols icon. 📖 [Icon Reference](https://companion.home-assistant.io/docs/notifications/actionable-notifications#icon-values) | ((`🍎 iOS Only`, `Optional`))"
          default: ""
          selector:
            text:
              prefix: "sfsymbols:"
        option_two_is_destructive:
          name: "🍎 2️⃣ Destructive"
          description: "Set the action's title to be red, indicating a destructive action.  \n\n(`🍎 iOS Only`, `Optional`)"
          default: false
          selector:
            boolean:
        option_two_authentication_required:
          name: "🍎 2️⃣ Authentication Required"
          description: "Require device to be unlocked to use this option.  \n\n(`🍎 iOS Only`, `Optional`)"
          default: false
          selector:
            boolean:
        option_three_enabled:
          name: "🍎 🤖 Option 3 - Enabled"
          default: false
          selector:
            boolean:
        option_three_text:
          name: "🍎 🤖 3️⃣ Title"
          description: "Title to show on the third option."
          default: "Option 3"
          selector:
            text:
        option_three_mode:
          name: "🤖 3️⃣ Mode"
          description: >-
            Choose Action(s) or Link mode. See Android Note above.<br><br>
            To do nothing: Pick `Action(s)` and leave Action(s) empty.<br><br>
            (`🤖 Android Only`, `Optional`)
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - label: ""
                  value: ""
                - label: Action(s)
                  value: action
