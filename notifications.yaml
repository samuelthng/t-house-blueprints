 timeout_settings:
 name: "Timeout Settings"
 icon: mdi:timer-outline
 collapsed: true
 input:
 enable_timeout:
 name: "⌛ Enable Timeout"
 description: "Require script to stop listening after the set duration.<br><br> Recommended to enable.<br> If disabled, script will wait for response indefinitely until the next time it is triggered."
 default: true # Default `true` for backward compatibility.
 selector:
 boolean:
 timeout:
 name: "⌛ Timeout Duration"
 description: "How long to wait for user response before executing timeout actions.<br><br>**Use case:** Wait 5 minutes for response to door unlock request, 30 seconds for garage closing confirmation.<br><br> [Actionable Notifications](https://companion.home-assistant.io/docs/notifications/actionable-notifications)<br><br> Recommended: ≥1 minute for reliable notification delivery<br>Default: 15 minutes"
 default:
 hours: 0
 minutes: 15
 seconds: 0
 selector:
 duration:
 enable_day: false
 run_timeout_actions:
 name: "⌛ Enable Timeout Action(s)"
 description: "Run timeout actions upon a timeout event.<br><br> Recommended to enable.<br> If disabled, script will timeout without executing any timeout actions."
 default: true # Default `true` for backward compatibility.
 selector:
 boolean:
 timeout_action:
 name: "⌛ Timeout Action(s)"
 description: "Action to run when notification response is timed out. \n\n Leave empty if no actions should be run \n\n Android Users: Note, URI options do not stop the timeout countdown. This action could be run after pressing the URI option.\n Android Users: Workaround for the above, you may disable `⌛ Run timeout action(s) when notification cleared` and manually clear the notification after selecting your URI option. \n\n`Optional`"
 default: []
 selector:
 action:
 swipe_away_as_timeout:
 name: "⌛ Run timeout action(s) when notification cleared"
 description: "If enabled, swiping the notification away will immediately trigger timeout actions. \n\n` Android Only`"
 default: false
 selector:
 boolean:
 clear_on_timeout:
 name: " Clear notification on timeout"
 description: "Dismiss the notification after action selection times out."
 default: false
 selector:
 boolean:


