  #   selector:
  #     action:
  field_enable_timeout:
    name: "⌛️ Enable Timeout"
    description: "Override timeout feature."
    example: !input enable_timeout
    selector:
      boolean:

  field_timeout:
    name: "⌛️ Timeout Duration"
    description: "Override timeout duration"
    default: !input timeout
    selector:
      duration:
        enable_day: false

  field_run_timeout_actions:
    name: "⌛️ Enable Timeout Action(s)"
    description: "Override running timeout actions"
    example: !input run_timeout_actions
    selector:
      boolean:

  field_notification_link:
    name: "🔗 Notification Link"
    description: "Override notification link"
    example: !input notification_link
    default: !input notification_link
    selector:
      text:

  # [Unsupported due to `choose.sequence`] - Can't pass variables to choose.sequence.
  # field_timeout_action:
  #   name: "⌛️ Timeout Action(s)"
  #   description: "Override timeout action."
  #   example: >-
  #     - alias: This is an example action
  #       service: homeassistant.check_config
  #   default: !input timeout_action
  #   selector:
  #     action:
  field_badge:
    name: "🔢 Badge"
    description: "Override app badge number. 🍎 iOS Only"
    default: !input badge
    selector:
      number:
        min: 0
        max: 999
        mode: box
  field_thread_id:
    name: "🧵 Thread ID"
    description: "Override thread/conversation ID. 🍎 iOS Only"
    default: !input thread_id
    selector:
      text:
  field_presentation_options:
    name: "🎨 Presentation Options"
    description: "Override presentation options. 🍎 iOS Only"
    default: !input presentation_options
    selector:
      select:
        multiple: true
        options:
          - label: "Banner"
            value: "banner"
          - label: "Sound"
            value: "sound"
          - label: "Badge"
            value: "badge"
          - label: "List"
            value: "list"
  field_sticky:
    name: "📌 Sticky"
    description: "Override sticky notification setting. 🤖 Android Only"
    default: !input sticky
    selector:
      boolean:
  field_vibration_pattern:
    name: "📳 Vibration Pattern"
    description: "Override vibration pattern. 🤖 Android Only"
    default: !input vibration_pattern
    selector:
      text:
  field_led_color:
    name: "💡 LED Color"
    description: "Override LED color. 🤖 Android Only"
    default: !input led_color
    selector:
      text:
  field_alert_once:
    name: "🔕 Alert Once"
    description: "Override alert once setting. 🤖 Android Only"
    default: !input alert_once
    selector:
      boolean:

sequence:
  ##############################
  # Setup Variables
  ##############################
  - alias: Basic Notification Content
    variables:
      # Title
      script_title: !input title
      title: "{{ iif(field_title is defined, field_title, script_title) }}"

      # Subtitle
      script_subtitle: !input subtitle
      subtitle: "{{ iif(field_subtitle is defined, field_subtitle, script_subtitle) }}"

      # Message
      script_message: !input message
      message: "{{ iif(field_message is defined and (field_message|length), field_message, script_message) }}"

      # Sound
      script_sound: !input sound
      sound: "{{ iif(field_sound is defined, field_sound, script_sound) }}"

  - alias: Common Configuration Options
    variables:
      # [Opening a URL] - https://companion.home-assistant.io/docs/notifications/notifications-basic/#opening-a-url
      script_notification_link: !input notification_link
      notification_link: "{{ iif(field_notification_link is defined, field_notification_link, script_notification_link) }}"

      # [Tag]
      custom_tag: !input tag # No need for manual definition anymore, treat existing definitions as custom tags.
      tag: "{{ iif(custom_tag|length, custom_tag, (this.entity_id ~ '-' ~ context.id)) | truncate(64, killwords=True, end='') }}"

      # [Grouping]
      group: !input group

  - alias: Android Configuration Options
    variables:
      channel: !input channel
      visibility: !input visibility
      importance: !input importance
      persist: !input persist
      car_ui: !input car_ui
      
      # New Phase 1 features
      script_sticky: !input sticky
      sticky: "{{ iif(field_sticky is defined, field_sticky, script_sticky) }}"
      script_vibration_pattern: !input vibration_pattern
      vibration_pattern: "{{ iif(field_vibration_pattern is defined, field_vibration_pattern, script_vibration_pattern) }}"
      script_led_color: !input led_color
      led_color: "{{ iif(field_led_color is defined, field_led_color, script_led_color) }}"
      script_alert_once: !input alert_once
      alert_once: "{{ iif(field_alert_once is defined, field_alert_once, script_alert_once) }}"

      # [Notification Banner Icon]
      notification_icon: !input icon
      enable_icon_color: !input enable_icon_color
      icon_color_selector: !input icon_color
      icon_color_hex: '{{ "#{:02x}{:02x}{:02x}".format(icon_color_selector[0], icon_color_selector[1], icon_color_selector[2]) }}'
      android_high_priority: !input android_high_priority
      
      # Android clear notification handling (v3.0 - consolidated)
      on_manual_clear_action: !input on_manual_clear_action
      clear_notification_actions: !input clear_notification_actions

  - alias: iOS Configuration Options
    variables:
      interruption_level: !input interruption_level
      
      # New Phase 1 features
      script_badge: !input badge
      badge: "{{ iif(field_badge is defined, field_badge, script_badge) }}"
      script_thread_id: !input thread_id
      thread_id: "{{ iif(field_thread_id is defined, field_thread_id, script_thread_id) }}"
      script_presentation_options: !input presentation_options
      presentation_options: "{{ iif(field_presentation_options is defined, field_presentation_options, script_presentation_options) }}"
      # shortcut: !input shortcut # Unlikely to be supported due to complexity.
      # [Critical Notifications] - https://companion.home-assistant.io/docs/notifications/critical-notifications
      # critical: !input critical
      # volume: !input volume

  - alias: Timeout
    variables:
      script_enable_timeout: !input enable_timeout
      enable_timeout: "{{ iif(field_enable_timeout is defined, field_enable_timeout, script_enable_timeout) }}"
      clear_behavior_on_timeout: !input clear_behavior_on_timeout
      script_timeout: !input timeout # Load timeout into variable for use with templates.
      timeout: "{{ iif(field_timeout is defined, field_timeout, script_timeout) }}"
      timeout_seconds: "{{ (timeout.hours * 60 + timeout.minutes) * 60 + timeout.seconds }}"
      script_run_timeout_actions: !input run_timeout_actions
      run_timeout_actions: "{{ iif(field_run_timeout_actions is defined, field_run_timeout_actions, script_run_timeout_actions) }}"

  - alias: Timeout Response Handling Configuration
    variables:
      notify_other_devices_on_timeout: !input notify_other_devices_on_timeout
      other_devices_timeout_message: !input other_devices_timeout_message

  - alias: Response Handling Configuration
    variables:
      response_mode: !input response_mode
      clear_other_notifications: !input clear_other_notifications
      notify_other_devices_on_response: !input notify_other_devices_on_response
      other_devices_message_template: !input other_devices_message_template
      run_actions_for_others_on_response: !input run_actions_for_others_on_response
      other_devices_actions: !input other_devices_actions
      # Track if we're in multi-device scenario
      is_multi_device: "{{ devices_info | length > 1 }}"
      # For single response mode, we'll track the responding device
      responding_device_name: ""

  - alias: Attachments
    variables:
      script_attachment_type: !input attachment_type
      attachment_type: "{{ iif(field_attachment_type is defined, field_attachment_type, script_attachment_type) }}"
      script_attachment_camera_entity: !input attachment_camera_entity
      attachment_camera_entity: "{{ iif(field_attachment_camera_entity is defined, field_attachment_camera_entity, script_attachment_camera_entity) }}"
      
      # New Phase 1 features
      script_image_url: !input image_url
      image_url: "{{ iif(field_image_url is defined, field_image_url, script_image_url) }}"
      script_video_url: !input video_url
      video_url: "{{ iif(field_video_url is defined, field_video_url, script_video_url) }}"
      
      camera_image_url: >-
        {% if (attachment_camera_entity|length) %}
          {% if (state_attr(attachment_camera_entity,'entity_picture')|length) %}
            {{state_attr(attachment_camera_entity,'entity_picture')}}
          {% else %}
            {{"/api/camera_proxy/{id}".format(id=attachment_camera_entity)}}
          {%- endif %}
        {%- endif %}
      media_url: >-
        {{
          {
            'none': '',
            'camera_entity': iif(camera_image_url | length, camera_image_url)
          }.get(attachment_type)
        }}

  - alias: Device Configuration
    variables:
      script_notify_device: !input notify_device
      notify_device: "{{ iif(field_notify_device is defined, field_notify_device, script_notify_device) }}"
      # Multi-device support: Convert single device or list of devices to a proper list
      notify_devices_list: >-
        {% if notify_device is string %}
          {{ [notify_device] }}
        {% elif notify_device is iterable %}
          {{ notify_device | list }}
        {% else %}
          {{ [notify_device] }}
        {% endif %}
      # Build device information for each device
      devices_info: >-
        {% set devices = namespace(list=[]) %}
        {% for device_id in notify_devices_list %}
          {% set device_name = device_attr(device_id, 'name') %}
          {% if device_name is not none %}
            {% set device_manufacturer = device_attr(device_id, 'manufacturer') | default('') | upper %}
            {% set is_apple = 'APPLE' in device_manufacturer %}
            {% set service_name = "notify.mobile_app_{id}".format(id=device_name|slugify) %}
            {% set devices.list = devices.list + [{
              'device_id': device_id,
              'device_name': device_name|slugify,
              'is_apple': is_apple,
              'service_name': service_name
            }] %}
          {% endif %}
        {% endfor %}
        {{ devices.list }}
      # For backwards compatibility - use first device if only one selected
      notify_service: >-
        {% if devices_info | length == 1 %}
          {{ devices_info[0].service_name }}
        {% else %}
          {{ "notify.mobile_app_{id}".format(id=device_attr(notify_devices_list[0],'name')|slugify) }}
        {% endif %}

  - alias: Option 1
    variables:
      first_option: "{{ 'FIRST_' ~ context.id }}"
      script_option_one_enabled: !input option_one_enabled
      option_one_enabled: "{{ iif(field_option_one_enabled is defined, field_option_one_enabled, script_option_one_enabled) }}"
      script_option_one_title: !input option_one_text
      option_one_title: "{{ iif(field_option_one_text is defined, field_option_one_text, script_option_one_title) }}"
      option_one_mode: !input option_one_mode
      script_option_one_actions: !input option_one_action
      option_one_actions: "{{ iif(field_option_one_action is defined, field_option_one_action, script_option_one_actions) }}"
      option_one_uri: !input option_one_uri
      option_one_icon_value: !input option_one_icon
      option_one_icon: >-
        {% if 'sfsymbols:' in option_one_icon_value %}
        {{ option_one_icon_value }}
        {% elif option_one_icon_value | length %}
        {{ "sfsymbols:{icon}".format(icon=option_one_icon_value) }}
        {%- endif %}
      option_one_is_destructive: !input option_one_is_destructive
      option_one_auth_required: !input option_one_authentication_required
      option_one_action: >-
        {% if option_one_mode == 'uri' %}
        {{ 'URI' }}
        {% else %}
        {{ first_option }}
        {% endif %}
      option_one: >-
        {{ {
          'enabled': option_one_enabled,
          'action': option_one_action,
          'title': option_one_title,
          'actions': option_one_actions,
          'icon': option_one_icon,
          'destructive': option_one_is_destructive,
          'authenticationRequired': option_one_auth_required,
          "{}".format('uri' if option_one_uri|length else ''): option_one_uri,
        } }}

  - alias: Option 2
    variables:
      second_option: "{{ 'SECOND_' ~ context.id }}"
      script_option_two_enabled: !input option_two_enabled
      option_two_enabled: "{{ iif(field_option_two_enabled is defined, field_option_two_enabled, script_option_two_enabled) }}"
      option_two_title: !input option_two_text
      option_two_mode: !input option_two_mode
      script_option_two_actions: !input option_two_action
      option_two_actions: "{{ iif(field_option_two_action is defined, field_option_two_action, script_option_two_actions) }}"
      option_two_uri: !input option_two_uri
      option_two_icon_value: !input option_two_icon
      option_two_icon: >-
        {% if 'sfsymbols:' in option_two_icon_value %}
        {{ option_two_icon_value }}
        {% elif option_two_icon_value | length %}
        {{ "sfsymbols:{icon}".format(icon=option_two_icon_value) }}
        {%- endif %}
      option_two_is_destructive: !input option_two_is_destructive
      option_two_auth_required: !input option_two_authentication_required
      option_two_action: >-
        {% if option_two_mode == 'uri' %}
        {{ 'URI' }}
        {% else %}
        {{ second_option }}
        {% endif %}
      option_two: >-
        {{{
          'enabled': option_two_enabled,
          'action': option_two_action,
          'title': option_two_title,
          'actions': option_two_actions,
          'icon': option_two_icon,
          'destructive': option_two_is_destructive,
          'authenticationRequired': option_two_auth_required,
          "{}".format('uri' if option_two_uri|length else ''): option_two_uri,
        }}}

  - alias: Option 3
    variables:
      third_option: "{{ 'THIRD_' ~ context.id }}"
      script_option_three_enabled: !input option_three_enabled
      option_three_enabled: "{{ iif(field_option_three_enabled is defined, field_option_three_enabled, script_option_three_enabled) }}"
      option_three_title: !input option_three_text
      option_three_mode: !input option_three_mode
      script_option_three_actions: !input option_three_action
      option_three_actions: "{{ iif(field_option_three_action is defined, field_option_three_action, script_option_three_actions) }}"
      option_three_uri: !input option_three_uri
      option_three_icon_value: !input option_three_icon
      option_three_icon: >-
        {% if 'sfsymbols:' in option_three_icon_value %}
        {{ option_three_icon_value }}
        {% elif option_three_icon_value | length %}
        {{ "sfsymbols:{icon}".format(icon=option_three_icon_value) }}
        {%- endif %}
      option_three_is_destructive: !input option_three_is_destructive
      option_three_auth_required: !input option_three_authentication_required
      option_three_action: >-
        {% if option_three_mode == 'uri' %}
        {{ 'URI' }}
        {% else %}
        {{ third_option }}
        {% endif %}
      option_three: >-
        {{{
          'enabled': option_three_enabled,
          'action': option_three_action,
          'title': option_three_title,
          'actions': option_three_actions,
          'icon': option_three_icon,
          'destructive': option_three_is_destructive,
          'authenticationRequired': option_three_auth_required,
          "{}".format('uri' if option_three_uri|length else ''): option_three_uri,
        }}}

  - alias: Setup Payload
    variables:
      options: >-
        {{ [option_one, option_two, option_three] | selectattr('enabled') | list }}
      expect_response: "{{ enable_timeout or option_one_enabled or option_two_enabled or option_three_enabled }}" # If there's no timeout nor options, then no point waiting. Stop script.
      # Build common notification data (will be customized per device platform)
      common_data: >-
        {% set common = namespace(data={}) %}
        {# Common fields for all platforms #}
        {% set common.data = dict(common.data, **{ 'actions': options }) %}
        {% set common.data = dict(common.data, **{ 'tag': tag }) %}
        {% if group|length %}{% set common.data = dict(common.data, **{ 'group': group }) %}{% endif %}
        {{ common.data }}

  ##############################
  # Send Notification
  ##############################
  - alias: "Send notifications to all devices"
    repeat:
      for_each: "{{ devices_info }}"
      sequence:
        - variables:
            current_device: "{{ repeat.item }}"
            current_device_id: "{{ repeat.item.device_id }}"
            is_apple: "{{ repeat.item.is_apple }}"
            service_name: "{{ repeat.item.service_name }}"
            # Build platform-specific payload for this device
            notification_data: >-
              {% set payload = namespace(data=common_data.copy()) %}
              {% set payload.data = dict(payload.data, **{ 'apple_device': is_apple }) %}
              {% if is_apple %}
                {# iOS #}
                {% set push = namespace(d={}) %}
                {% set payload.data = dict(payload.data, **{ 'subtitle': subtitle }) %}
                {% set push.d = dict(push.d, **{ 'interruption-level': interruption_level }) %}
                {% if notification_link|length %}{% set payload.data = dict(payload.data, **{ 'url': notification_link }) %}{% endif %}
                {% if attachment_type == 'camera_entity' %}{% set payload.data = dict(payload.data, **{ 'entity_id': attachment_camera_entity }) %}{% endif %}
                {% if sound|length %}{% set push.d = dict(push.d, **{ 'sound': sound }) %}{% endif %}
                {% if badge is not none and badge != '' %}{% set payload.data = dict(payload.data, **{ 'badge': badge|int }) %}{% endif %}
                {% if thread_id|length %}{% set payload.data = dict(payload.data, **{ 'thread-id': thread_id }) %}{% endif %}
                {% if presentation_options|length %}{% set push.d = dict(push.d, **{ 'presentation-options': presentation_options }) %}{% endif %}
                {% if image_url|length %}{% set payload.data = dict(payload.data, **{ 'image': image_url }) %}{% endif %}
                {% if video_url|length %}{% set payload.data = dict(payload.data, **{ 'video': video_url }) %}{% endif %}
                {% set payload.data = dict(payload.data, **{ 'push': push.d }) %}
              {% else %}
                {# Android #}
                {% set payload.data = dict(payload.data, **{ 'subject': subtitle }) %}
                {% set payload.data = dict(payload.data, **{ 'visibility': visibility }) %}
                {% set payload.data = dict(payload.data, **{ 'importance': importance }) %}
                {% if android_high_priority %}{% set payload.data = dict(payload.data, **{ 'priority': 'high', 'ttl': 0 }) %}{% endif %}
                {% if notification_link|length %}{% set payload.data = dict(payload.data, **{ 'clickAction': notification_link }) %}{% endif %}
                {% if attachment_type == 'camera_entity' and (media_url|length) %}{% set payload.data = dict(payload.data, **{ 'image': media_url }) %}{% endif %}
                {% if notification_icon|length %}{% set payload.data = dict(payload.data, **{ 'notification_icon': notification_icon }) %}{% endif %}
                {% if enable_icon_color %}{% set payload.data = dict(payload.data, **{ 'color': icon_color_hex }) %}{% endif %}
                {% if enable_timeout and clear_behavior_on_timeout == 'clear_this' %}{% set payload.data = dict(payload.data, **{ 'timeout': timeout_seconds }) %}{% endif %}
                {% if channel|length %}{% set payload.data = dict(payload.data, **{ 'channel': channel }) %}{% endif %}
                {% if persist %}{% set payload.data = dict(payload.data, **{ 'persistent': persist }) %}{% endif %}
                {% if car_ui %}{% set payload.data = dict(payload.data, **{ 'car_ui': car_ui }) %}{% endif %}
                {% if sound|length %}{% set payload.data = dict(payload.data, **{ 'sound': sound }) %}{% endif %}
                {% if sticky %}{% set payload.data = dict(payload.data, **{ 'sticky': sticky }) %}{% endif %}
                {% if vibration_pattern|length %}{% set payload.data = dict(payload.data, **{ 'vibration_pattern': vibration_pattern }) %}{% endif %}
                {% if led_color|length %}{% set payload.data = dict(payload.data, **{ 'led_color': led_color }) %}{% endif %}
                {% if alert_once %}{% set payload.data = dict(payload.data, **{ 'alert_once': alert_once }) %}{% endif %}
                {% if image_url|length %}{% set payload.data = dict(payload.data, **{ 'image': image_url }) %}{% endif %}
                {% if video_url|length %}{% set payload.data = dict(payload.data, **{ 'video': video_url }) %}{% endif %}
              {% endif %}
              {{ payload.data }}
        - alias: "Send notification to {{ repeat.item.device_name }}"
          service: "{{ service_name }}"
          data:
            title: "{{ title }}"
            message: "{{ message }}"
            data: "{{ notification_data }}"

  ##############################
  # Evaluate Response
  ##############################
  - alias: Determine if script has to wait for response?
    choose:
      - alias: "No need for response"
        conditions: "{{ expect_response == false }}"
        sequence: []
      - alias: "Should await response with timeout?"
        conditions: "{{ enable_timeout }}"
        sequence:
          - alias: "Awaiting response with timeout…"
            wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ first_option }}"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ second_option }}"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ third_option }}"
              - platform: event
                event_type: mobile_app_notification_cleared
                event_data:
                  tag: "{{ tag }}"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
      - alias: "Should await response indefinitely?"
        conditions: "{{ enable_timeout == false }}"
        sequence:
          - alias: "Awaiting response indefinitely…"
            wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ first_option }}"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ second_option }}"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ third_option }}"
              - platform: event
                event_type: mobile_app_notification_cleared
                event_data:
                  tag: "{{ tag }}"

  ##############################
  # Parse user response
  ##############################
  - alias: "Parse response into variable"
    variables:
      user_response: >-
        {% set response = namespace(data={ 'payload': notification_data }) %}
        {% if not expect_response %}
        {% set response.data = dict(response.data, **{ 'result': "no_response" }) %}
        {% elif run_timeout_actions and wait.trigger == none %}
        {% set response.data = dict(response.data, **{ 'result': "timeout" }) %}
        {% elif run_timeout_actions and on_manual_clear_action == 'treat_as_timeout' and wait.trigger.event.event_type == 'mobile_app_notification_cleared' %}
        {% set response.data = dict(response.data, **{ 'result': "notification_cleared" }) %}
        {% elif wait.trigger.event.data.action == option_one['action'] %}
        {% set response.data = dict(response.data, **{ 'result': "option_one" }) %}
        {% elif wait.trigger.event.data.action == option_two['action'] %}
        {% set response.data = dict(response.data, **{ 'result': "option_two" }) %}
        {% elif wait.trigger.event.data.action == option_three['action'] %}
        {% set response.data = dict(response.data, **{ 'result': "option_three" }) %}
        {%- endif %}
        {# Add device info if available #}
        {% if wait.trigger is defined and wait.trigger.event is defined and wait.trigger.event.data.device_id is defined %}
        {% set response.data = dict(response.data, **{ 'device_id': wait.trigger.event.data.device_id }) %}
        {% endif %}
        {{ response.data }}
      responding_device_name: >-
        {% if user_response.device_id is defined %}
          {% set name = device_attr(user_response.device_id, 'name') %}
          {{ name if name is not none else 'unknown device' }}
        {% else %}
          unknown device
        {% endif %}

  ##############################
  # Handle Multi-Device Response
  ##############################
  - alias: "Handle other devices (single response mode)"
    choose:
      - alias: "Single response mode with multiple devices"
        conditions:
          - "{{ is_multi_device }}"
          - "{{ response_mode == 'single' }}"
          - "{{ user_response.result in ['option_one', 'option_two', 'option_three'] }}"
        sequence:
          # Clear notifications on other devices
          - choose:
              - conditions: "{{ clear_other_notifications }}"
                sequence:
                  - alias: "Clear notifications on other devices"
                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - choose:
                            - conditions: "{{ repeat.item.device_id != user_response.device_id }}"
                              sequence:
                                - service: "{{ repeat.item.service_name }}"
                                  data:
                                    message: "clear_notification"
                                    data:
                                      tag: "{{ tag }}"
          
          # Notify other devices
          - choose:
              - conditions: "{{ notify_other_devices_on_response }}"
                sequence:
                  - alias: "Send notification to other devices"
                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - choose:
                            - conditions: "{{ repeat.item.device_id != user_response.device_id }}"
                              sequence:
                                - service: "{{ repeat.item.service_name }}"
                                  data:
                                    title: "{{ title }}"
                                    message: >-
                                      {% set original_message = message %}
                                      {{ other_devices_message_template }}
                                    data:
                                      tag: "{{ tag }}_handled"
          
          # Run actions for other devices
          - choose:
              - conditions: "{{ run_actions_for_others_on_response }}"
                sequence:
                  - alias: "Run actions for each non-responding device"
                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - choose:
                            - conditions: "{{ repeat.item.device_id != user_response.device_id }}"
                              sequence: !input other_devices_actions


  ##############################
  # Handle Multi-Device Timeout Response
  ##############################
  - alias: "Handle timeout for multi-device scenarios"
    choose:
      - alias: "Timeout occurred with multiple devices"
        conditions:
          - "{{ is_multi_device }}"
          - "{{ user_response.result == 'timeout' }}"
        sequence:
          # Clear notifications based on clear_behavior_on_timeout
          - choose:
              - conditions: "{{ clear_behavior_on_timeout == 'clear_all' }}"
                sequence:
                  - alias: "Clear notifications on ALL devices"
                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - service: "{{ repeat.item.service_name }}"
                          data:
                            message: "clear_notification"
                            data:
                              tag: "{{ tag }}"
              - conditions: "{{ clear_behavior_on_timeout == 'clear_others' }}"
                sequence:
                  - alias: "Clear notifications on other devices"
                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - service: "{{ repeat.item.service_name }}"
                          data:
                            message: "clear_notification"
                            data:
                              tag: "{{ tag }}"
          
          # Notify devices about timeout
          - choose:
              - conditions: "{{ notify_other_devices_on_timeout }}"
                sequence:
                  - alias: "Send timeout notification to all devices"
                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - service: "{{ repeat.item.service_name }}"
                          data:
                            title: "{{ title }}"
                            message: >-
                              {% set original_message = message %}
                              {% set notified_devices = devices_info | map(attribute='device_name') | list %}
                              {{ other_devices_timeout_message }}
                            data:
                              tag: "{{ tag }}_timeout"

  ##############################
  # Trigger Response Actions
  ##############################
  - alias: "Run response actions"
    default: []
    choose:
      - alias: "Trigger: Timeout"
        conditions: "{{ user_response.result == 'timeout' }}"
        sequence: !input timeout_action # "{{ timeout_actions }}"
      - alias: "Trigger: Notification Cleared"
        conditions: "{{ user_response.result == 'notification_cleared' }}"
        sequence:
          - choose:
              # If on_manual_clear_action is 'treat_as_timeout', run timeout actions
              - conditions: "{{ on_manual_clear_action == 'treat_as_timeout' }}"
                sequence: !input timeout_action
              # If on_manual_clear_action is 'run_custom', run clear actions
              - conditions: "{{ on_manual_clear_action == 'run_custom' }}"
                sequence: !input clear_notification_actions
            # Default: do_nothing - no actions run
      - alias: "Trigger: first_option"
        conditions: "{{ user_response.result == 'option_one' }}"
        sequence: !input option_one_action # "{{ option_one_actions }}"
      - alias: "Trigger: second_option"
        conditions: "{{ user_response.result == 'option_two' }}"
        sequence: !input option_two_action # "{{ option_two_actions }}"
      - alias: "Trigger: third_option"
        conditions: "{{ user_response.result == 'option_three' }}"
        sequence: !input option_three_action # "{{ option_three_actions }}"

  ##############################
  # Compatibility: iOS Clear Notification
  ##############################
  - alias: "Send clear notification commands"
    if:
      - alias: "Should send clear notification command? (for iOS/macOS)?"
        condition: template
        value_template: "{{ expect_response and enable_timeout and clear_behavior_on_timeout == 'clear_this' and notification_data.apple_device }}"
    then:
      - alias: "Send clear notification command to iOS device"
        service: "{{ notify_service }}"
        data:
          message: "clear_notification"
          data:
            tag: "{{ tag }}"

  ##############################
  # Return user response
  ##############################
  - stop: "Script stopped."
    response_variable: "user_response"
