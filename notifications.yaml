    what_to_send:
      name: "What to Send"
      icon: mdi:email-edit-outline
      collapsed: true
      description: >-


        **Configure notification attachments** - Add camera snapshots, images, or videos to your notifications.



        💡 **Tip**: Select attachment type first, then configure the corresponding field below.




      input:
        attachment_type:
          name: "📸 Attachment Type"
          description: >-
            Choose what type of attachment to send with the notification.

            • None - No attachment (default)
            • Camera - Live camera snapshot
            • Image URL - Static image from URL
            • Video URL - Video file (platform support varies)

            📖 [Notification Attachments Docs](https://companion.home-assistant.io/docs/notifications/notification-attachments) | Optional
          default: "none"
          selector:
            select:
              options:
                - label: "None"

                  value: "none"
                - label: "Camera"

                  value: "camera_entity"
                - label: "Image URL"

                  value: "image_url"
                - label: "Video URL"

                  value: "video_url"
        attachment_camera_entity:
          name: "📸 Camera Entity"
          description: >-
            Select a camera to capture a snapshot for the notification.

            Platform Behavior:
            • iOS: Camera Stream - Displays live camera feed
            • Android: Automatic Snapshots - Captures static snapshot

            Only used when Attachment Type is set to "Camera"

            📖 [iOS Camera Stream](https://companion.home-assistant.io/docs/notifications/dynamic-content#camera-stream) | [Android Snapshots](https://companion.home-assistant.io/docs/notifications/notification-attachments#automatic-snapshots) | Optional
          default: ""
          selector:
            entity:
              filter:
                - domain: "camera"

        image_url:
          name: "🖼️ Image URL"
          description: >-
            URL or path to an image file to attach.

            Examples:

             - `https://example.com/alert.jpg` (external URL)

             - `/local/images/warning.png` (local file)

             - `{{ states.weather.home.attributes.entity_picture }}` (template)

            Only used when Attachment Type is set to "Image URL"

            📖 [Docs](https://companion.home-assistant.io/docs/notifications/notification-attachments) | Optional
          default: ""
          selector:
            text:
        video_url:
          name: "🎥 Video URL"
          description: >-
            URL or path to a video file to attach.

            Example: `/local/videos/doorbell_clip.mp4`

            Only used when Attachment Type is set to "Video URL". Platform support varies - test on your devices.

            📖 [Docs](https://companion.home-assistant.io/docs/notifications/notification-attachments#video) | Optional
          default: ""
          selector:
            text:

