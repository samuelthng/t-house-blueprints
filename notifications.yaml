    ### Known Issues

      <details>
      <summary>Expand/collapse known issues</summary>

      - In some cases, iOS does not seem to play well with newer features. 
        If that happens to you, you can [check out older releases here](https://github.com/samuelthng/t-house-blueprints/releases).

      - In some cases, some setups have difficulty receiving events from the device.
        When this happens, no actions will be performed by Home Assistant.

        You can test this:
          - Navigate to Developer Tools → Events
          - Listen to event: `mobile_app_notification_action`
          - Trigger a notification to your device by running the script
          - Select an action option

        If you do not see an event appearing in the Events page, this could be the issue.
        You might want to check the [troubleshooting documents](https://companion.home-assistant.io/docs/troubleshooting/faqs), or check your network configuration to resolve the issue.

      </details>

    ### FAQ

      <details>
      <summary>Expand/collapse FAQ</summary>

      - **_Can I send notifications to multiple devices?_**
        Yes! Version 2.3.0 adds full multi-device support. Select multiple devices and configure response handling (first-response-wins or all-respond modes). Each device gets platform-optimized payloads (iOS/Android).

      - **_Will you add sending notifications to multiple devices?_**
        ✅ DONE! Version 2.3.0 implements multi-device support with advanced features like auto-clear, notify other devices, and configurable response modes.

      - **_Why can't I see my devices or notify service?_**
        You might want to check if troubleshooting steps provided by the [Home Assistant Companion app documentation](https://companion.home-assistant.io/docs/troubleshooting/faqs) may be able to help.

      - **_Why do I keep receiving notifications incessantly?_**
        Check your scripts and automation, there might be a logical loop going on that's triggering the notification over and over again. If you need further help, feel free to drop by the [main post](https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/) and share your automation and scripts yamls.

      </details>
      <br>

  input:
    required_settings:
      name: "Required Settings"
      icon: mdi:cog-outline
      collapsed: false
      description: >-
        <br>
        **Essential configuration** - Device selection and notification message (🍎 iOS | 🤖 Android).
        <br><br>

      input:
        notify_device:
          name: "📱 Device(s) to Notify"
          description: >-
            **REQUIRED** - Select one or more devices with Home Assistant Companion app installed.<br><br>
            Select multiple devices to send the same notification to all of them.<br><br>
            📖 [Setup Guide](https://companion.home-assistant.io/docs/notifications/notifications-basic) | (🍎 iOS | 🤖 Android)
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        message:
          name: "💬 Message"
          description: >-
            **REQUIRED** - Main notification text content.<br><br>
            **Supports Jinja2 templates** and HTML formatting (🤖 Android only).<br><br>
            **Examples:**<br>
             - Static: `Motion detected at front door`<br>
             - Template: `{{ trigger.to_state.attributes.friendly_name }} is {{ trigger.to_state.state }}`<br>
             - Conditional: `{% if is_state('binary_sensor.front_door', 'on') %}Door is open{% else %}Door is closed{% endif %}`<br><br>
            📖 [Notification Basics](https://companion.home-assistant.io/docs/notifications/notifications-basic) | (🍎 iOS | 🤖 Android)
          selector:
            text:
              multiline: true

    notification_appearance:
      name: "Notification Appearance"
      icon: mdi:palette-outline
      collapsed: true
      description: >-
        <br>
        **Customize notification look and feel** - Title, subtitle, sound, icon, colors, and interruption settings.
        <br><br>

      input:
        title:
          name: "🏷️ Title"
          description: "Headline text at the top of notification. Supports Jinja2 templates.<br><br>Example: `Front Door Alert` or `{{ trigger.to_state.attributes.friendly_name }}`<br><br>🍎 iOS | 🤖 Android | `Optional`"
          default: ""
          selector:
            text:
        subtitle:
          name: "🏷️ Subtitle"
          description: "Secondary text below title. Supports Jinja2 templates.<br><br>Example: `Person detected` or `{{ now().strftime('%I:%M %p') }}`<br><br>🍎 iOS only | `Optional`"
          default: ""
          selector:
            text:
        sound:
          name: "🔊 Sound"
          description: "Custom sound file when notification arrives. Supports templates.<br><br>Examples: `alarm.mp3` (🤖 Android in `/local/`), `default` (🍎 iOS)<br><br>📖 [Docs](https://companion.home-assistant.io/docs/notifications/notification-sounds) | 🍎 iOS | 🤖 Android | `Optional`"
          default: ""
          selector:
            text:
        icon:
          name: "🙂 Icon"
          description: "Custom icon for this notification.<br><br>🤖 Android only | `Optional`"
          default: ""
          selector:
            icon:
        enable_icon_color:
          name: "🎨 Use Icon Color"
          description: "If disabled, uses default icon color.<br><br>🤖 Android only | `Optional`"
          default: false
          selector:
            boolean:
        icon_color:
          name: "🎨 Icon Color"
          description: "Custom icon color for this notification.<br><br>🤖 Android only | `Optional`"
          default: [3, 169, 244]
          selector:
            color_rgb:
        badge:
          name: "🔢 Badge"
          description: "Number on app icon badge (0-999). Use 0 to clear.<br><br>Example: `1` for new alert, `0` to clear.<br><br>📖 [Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic#badge) | 🍎 iOS only | `Optional`"
          default: ""
          selector:
            number:
              min: 0
              max: 999
              mode: box
        interruption_level:
          name: "❕ Interruption Level"
          description: "Controls notification priority and behavior.<br><br>📖 [Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic/#interruption-level) | 🍎 iOS only | `Optional`"
          default: active
          selector:
            select:
              options:
                - label: "Silent (Makes no sound, does not wake screen)"
                  value: passive
                - label: "Default"
                  value: active
                - label: "Important (Overrides Focus)"
                  value: time-sensitive
                - label: "Critical (Overrides Focus and Mute, restricted features)"
                  value: critical

    what_to_send:
      name: "What to Send"
      icon: mdi:email-edit-outline
      collapsed: true
      description: >-
        <br>
        **Configure notification attachments** - Add camera snapshots, images, or videos to your notifications.
        <br><br>
        💡 **Tip**: Select attachment type first, then configure the corresponding field below.
        <br><br>

      input:
        attachment_type:
          name: "📸 Attachment Type"
          description: >
            Choose what type of attachment to send with the notification.<br><br>

            • **None** - No attachment (default)<br>
            • **Camera** - Live camera snapshot 🍎🤖<br>
            • **Image URL** - Static image from URL 🍎🤖<br>
            • **Video URL** - Video file 🍎🤖 (platform support varies)<br><br>

            📖 [Notification Attachments Docs](https://companion.home-assistant.io/docs/notifications/notification-attachments) | `Optional`
          default: "none"
          selector:
            select:
              options:
                - label: "None"
                  value: "none"
                - label: "Camera"
                  value: "camera_entity"
                - label: "Image URL"
                  value: "image_url"
                - label: "Video URL"
                  value: "video_url"
        attachment_camera_entity:
          name: "📸 Camera Entity"
          description: >-
            Select a camera to capture a snapshot for the notification.<br><br>

            **Platform Behavior**:<br>
            • 🍎 **iOS**: <a target="_blank" href="https://companion.home-assistant.io/docs/notifications/dynamic-content#camera-stream">Camera Stream</a> - Displays live camera feed<br>
            • 🤖 **Android**: <a target="_blank" href="https://companion.home-assistant.io/docs/notifications/notification-attachments#automatic-snapshots">Automatic Snapshots</a> - Captures static snapshot<br><br>

            ⚠️ **Only used when Attachment Type is set to "Camera"**<br>
            `Optional`
          default: ""
          selector:
            entity:
              filter:
                - domain: "camera"
        image_url:
          name: "🖼️ Image URL"
          description: >-
            URL or path to an image file to attach. 🍎🤖<br><br>

            **Examples**:<br>
            • `https://example.com/alert.jpg` (external URL)<br>
            • `/local/images/warning.png` (local file)<br>
            • `{{ states.weather.home.attributes.entity_picture }}` (template)<br><br>

            ⚠️ **Only used when Attachment Type is set to "Image URL"**<br>
            📖 [Docs](https://companion.home-assistant.io/docs/notifications/notification-attachments) | `Optional`
          default: ""
          selector:
            text:
        video_url:
          name: "🎥 Video URL"
          description: >-
            URL or path to a video file to attach. 🍎🤖<br><br>

            **Example**: `/local/videos/doorbell_clip.mp4`<br><br>

            ⚠️ **Only used when Attachment Type is set to "Video URL"**<br>
            ⚠️ **Platform support varies** - Test on your devices<br>
            📖 [Docs](https://companion.home-assistant.io/docs/notifications/notification-attachments#video) | `Optional`
          default: ""
          selector:
            text:

    action_buttons:
      name: "Action Buttons"
      icon: mdi:gesture-tap-button
      collapsed: true
      description: >-
        <br>
        Configure up to 3 action buttons on notifications for quick actions.<br><br>
        Examples: "Unlock Door" / "View Camera" / "Dismiss"<br><br>
        **⚠️ Android Note:** Android can't send events AND open links in one button. Choose Action(s) OR Link mode per button. iOS supports both simultaneously.<br><br>
        📖 [Actionable Notifications Guide](https://companion.home-assistant.io/docs/notifications/actionable-notifications)
        <br><br>

        
      input:
        option_one_enabled:
          name: "🍎 🤖 Option 1 - Enabled"
          default: true
          selector:
            boolean:
        option_one_text:
          name: "🍎 🤖 1️⃣ Title"
          description: "Title to show on the first option."
          default: "Confirm"
          selector:
            text:
        option_one_mode:
          name: "🤖 1️⃣ Mode"
          description: >-
            Choose Action(s) or Link mode. See Android Note above.<br><br>
            To do nothing: Pick `Action(s)` and leave Action(s) empty.<br><br>
            (`🤖 Android Only`, `Optional`)
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - label: ""
                  value: ""
                - label: Action(s)
                  value: action
                - label: "Link (🤖 Android Only)"
                  value: uri
        option_one_action:
          name: "🍎 🤖 1️⃣ Action(s)"
          description: "Action(s) to run when this option is selected.\n\n❔ Used with `Mode: Action(s)` option\n❔ Script stops after actions are run\n❔ Leave empty to do nothing\n\n`Optional`"
          default: []
          selector:
            action:
        option_one_uri:
          name: "🍎 🤖 1️⃣ Link"
          description: >-
            Open link/app when selected.<br><br>
            Examples: `/lovelace/dashboard`, `https://example.com`, `app://pkg.name`, `entityId:sun.sun`, `tel:123456789`<br><br>
            📖 [Link Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic/#opening-a-url)<br><br>
            ⚠️ Android: URI links won't stop timeout countdown. Check your timeout actions.<br><br>
            (`Optional`)
          default: ""
          selector:
            text:
              type: url
        option_one_icon:
          name: "🍎 1️⃣ Icon"
          description: "Custom SF Symbols icon. 📖 [Icon Reference](https://companion.home-assistant.io/docs/notifications/actionable-notifications#icon-values) | ((`🍎 iOS Only`, `Optional`))"
          default: ""
          selector:
            text:
              prefix: "sfsymbols:"
        option_one_is_destructive:
          name: "🍎 1️⃣ Destructive"
          description: "Set the action's title to be red, indicating a destructive action.  \n\n(`🍎 iOS Only`, `Optional`)"
          default: false
          selector:
            boolean:
        option_one_authentication_required:
          name: "🍎 1️⃣ Authentication Required"
          description: "Require device to be unlocked to use this option.  \n\n(`🍎 iOS Only`, `Optional`)"
          default: false
          selector:
            boolean:
        option_two_enabled:
          name: "🍎 🤖 Option 2 - Enabled"
          default: true
          selector:
            boolean:
        option_two_text:
          name: "🍎 🤖 2️⃣ Title"
          description: "Title to show on the second option."
          default: "Dismiss"
          selector:
            text:
        option_two_mode:
          name: "🤖 2️⃣ Mode"
          description: >-
            Choose Action(s) or Link mode. See Android Note above.<br><br>
            To do nothing: Pick `Action(s)` and leave Action(s) empty.<br><br>
            (`🤖 Android Only`, `Optional`)
          default: ""
          selector:
            select:
              mode: dropdown
              options:
                - label: ""
                  value: ""
                - label: Action(s)
                  value: action
                - label: "Link (🤖 Android Only)"
                  value: uri
        option_two_action:
          name: "🍎 🤖 2️⃣ Action(s)"
          description: "Action(s) to run when this option is selected.\n\n❔ Used with `Mode: Action(s)` option\n❔ Script stops after actions are run\n❔ Leave empty to do nothing\n\n`Optional`"
          default: []
