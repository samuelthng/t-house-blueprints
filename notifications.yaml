    ### Known Issues

      <details>
      <summary>Expand/collapse known issues</summary>

      - In some cases, iOS does not seem to play well with newer features.
        If that happens to you, you can [check out older releases here](https://github.com/samuelthng/t-house-blueprints/releases).

      - In some cases, some setups have difficulty receiving events from the device.
        When this happens, no actions will be performed by Home Assistant.

        You can test this:
          - Navigate to Developer Tools → Events

          - Listen to event: `mobile_app_notification_action`

          - Trigger a notification to your device by running the script

          - Select an action option

        If you do not see an event appearing in the Events page, this could be the issue.
        You might want to check the [troubleshooting documents](https://companion.home-assistant.io/docs/troubleshooting/faqs), or check your network configuration to resolve the issue.

      </details>

    ### FAQ

      <details>
      <summary>Expand/collapse FAQ</summary>

      - **_Can I send notifications to multiple devices?_**
        Yes! Version 2.3.0 adds full multi-device support. Select multiple devices and configure response handling (first-response-wins or all-respond modes). Each device gets platform-optimized payloads (iOS/Android).

      - **_Will you add sending notifications to multiple devices?_**
        ✅ DONE! Version 2.3.0 implements multi-device support with advanced features like auto-clear, notify other devices, and configurable response modes.

      - **_Why can't I see my devices or notify service?_**
        You might want to check if troubleshooting steps provided by the [Home Assistant Companion app documentation](https://companion.home-assistant.io/docs/troubleshooting/faqs) may be able to help.

      - **_Why do I keep receiving notifications incessantly?_**
        Check your scripts and automation, there might be a logical loop going on that's triggering the notification over and over again. If you need further help, feel free to drop by the [main post](https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/) and share your automation and scripts yamls.

      </details>



  input:
    required_settings:
      name: "Required Settings"
      icon: mdi:cog-outline
      collapsed: false
      description: >-


        **Essential configuration** - Device selection and notification message.




      input:
        notify_device:
          name: "📱 Device(s) to Notify"
          description: >-
            Select one or more devices with Home Assistant Companion app installed.

            Select multiple devices to send the same notification to all of them.

            📖 [Setup Guide](https://companion.home-assistant.io/docs/notifications/notifications-basic) | Required
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app

        message:
          name: "💬 Message"
          description: >-
            Main notification text content. Supports Jinja2 templates and HTML formatting (Android).

            Examples:

             - Static: `Motion detected at front door`

             - Template: `{{ trigger.to_state.attributes.friendly_name }} is {{ trigger.to_state.state }}`

             - Conditional: `{% if is_state('binary_sensor.front_door', 'on') %}Door is open{% else %}Door is closed{% endif %}`

            📖 [Notification Basics](https://companion.home-assistant.io/docs/notifications/notifications-basic) | Required
          default: ""
          selector:
            text:
              multiline: true

    notification_appearance:
      name: "Notification Appearance"
      icon: mdi:palette-outline
      collapsed: true
      description: >-


        **Customize notification look and feel** - Title, subtitle, sound, icon, colors, and interruption settings.




      input:
        title:
          name: "🏷️ Title"
          description: "Headline text at the top of notification. Supports Jinja2 templates.

Examples:

 - Static: `Front Door Alert`

 - Template: `{{ trigger.to_state.attributes.friendly_name }}`

`Optional`"
          default: ""
          selector:
            text:
        subtitle:
          name: "🏷️ Subtitle"
          description: "Secondary text below title. Supports Jinja2 templates.

Examples:

 - Static: `Person detected`

 - Template: `{{ now().strftime('%I:%M %p') }}`

🍎 iOS Only | `Optional`"
          default: ""
          selector:
            text:
        sound:
          name: "🔊 Sound"
          description: "Custom sound file when notification arrives. Supports templates.

Examples:

 - `alarm.mp3` (Android in `/local/`)

 - `default` (iOS)

📖 [Docs](https://companion.home-assistant.io/docs/notifications/notification-sounds) | `Optional`"
          default: ""
          selector:
            text:
        icon:
          name: "🙂 Icon"
          description: "Custom icon for this notification.

🤖 Android Only | `Optional`"
          default: ""
          selector:
            icon:
        enable_icon_color:
          name: "🎨 Use Icon Color"
          description: "If disabled, uses default icon color.

🤖 Android Only | `Optional`"
          default: false
          selector:
            boolean:
        icon_color:
          name: "🎨 Icon Color"
          description: "Custom icon color for this notification.

🤖 Android Only | `Optional`"
          default: [3, 169, 244]
          selector:
            color_rgb:
        badge:
          name: "🔢 Badge"
          description: "Number on app icon badge (0-999). Use 0 to clear.

Examples:

 - `1` for new alert

 - `0` to clear

📖 [Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic#badge) | 🍎 iOS Only | `Optional`"
          default: ""
          selector:
            number:
              min: 0
              max: 999
              mode: box
        interruption_level:
          name: "❕ Interruption Level"
          description: "Controls notification priority and behavior.

📖 [Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic/#interruption-level) | 🍎 iOS Only | `Optional`"
          default: active
          selector:
            select:
              options:
                - label: "Silent (Makes no sound, does not wake screen)"

                  value: passive
                - label: "Default"

                  value: active
                - label: "Important (Overrides Focus)"

                  value: time-sensitive
                - label: "Critical (Overrides Focus and Mute, restricted features)"

