mode: restart
blueprint:
  name: 🔔 Notifications (Version 3.0.0-beta - Blueprint v3.0 Refactored)
  source_url: https://github.com/samuelthng/t-house-blueprints/blob/main/notifications.yaml
  homeassistant:
    min_version: 2024.6.0
  domain: script
  author: samuelthng/t-house-blueprints
  description: >-
    <div>
      <h2>🔔 Notifications</h2>
      <b>Version 3.0.0-beta - Blueprint v3.0 Refactored</b> | 🔗 <a href="https://github.com/samuelthng/t-house-blueprints/blob/main/notifications.yaml" target="_blank">Github Link</a> | 💬 <a href="https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/551552" target="_blank">Community Post</a>
      </div>
      <br><br>
      <b>⚠️ BREAKING CHANGES in v3.0:</b>
      <ul>
        <li>Action button fields renamed: <code>confirm_*</code> → <code>option_one_*</code></li>
        <li>Action button fields renamed: <code>dismiss_*</code> → <code>option_two_*</code></li>
        <li>All button configuration consolidated into single "Action Buttons" section</li>
        <li><b>PHASE 5</b>: Clear-on-timeout options consolidated: 3 booleans → 1 dropdown (<code>clear_behavior_on_timeout</code>)</li>
        <li><b>PHASE 5</b>: Android clear options consolidated: 3 options → 1 dropdown + action (<code>on_manual_clear_action</code>)</li>
      </ul>
      <br>

    ---

      ### Features:
      <details>
      <summary>Expand/collapse features</summary>

      > 📲 Sends notification to [Home Assistant Companion](https://companion.home-assistant.io/)
      >
      > 🔢 Multi-device support - Send to multiple devices simultaneously (NEW in v2.3.0)
      >
      > 🎯 Configurable response modes - First-response-wins or all-respond (NEW in v2.3.0)
      >
      > 🧹 Auto-clear other devices when first responds (NEW in v2.3.0)
      >
      >
      > 3️⃣ Up to 3 customisable, action buttons (Previously: ✅ Confirm and ❌ Dismiss Button)
      >
      > ⌛️ Timeout actions with custom duration, fired if no option response received
      >
      > 🧹 Clear notification after timeout
      >
      > 📸 Camera Snapshots
      >
      > 🔗 Custom Notification Link
      >
      > 📜 Flexible [script fields](https://www.home-assistant.io/integrations/script/#fields)
      >
      > 🍎 Supports iOS
      >
      > 🤖 Supports Android

      </details>

      Examples can be found [here](https://community.home-assistant.io/t/notification-with-confirm-dismiss-and-timeout/551552#example-usage-6)

    ---

    ### Changelog

      <details>
      <summary>Expand/collapse changelog</summary>

      ### Version 3.0.0-beta Phase 5 - Clear Options Consolidation - *Current*
      - **BREAKING**: Consolidated 3 clear-on-timeout booleans into single dropdown `clear_behavior_on_timeout`
      - **BREAKING**: Removed: `clear_on_timeout`, `clear_other_notifications_on_timeout`, `clear_all_notifications_on_timeout`
      - **NEW**: `clear_behavior_on_timeout` dropdown with 4 options: keep_all, clear_this, clear_others, clear_all
      - **BREAKING**: Consolidated 3 Android clear options into single dropdown `on_manual_clear_action`
      - **BREAKING**: Removed: `treat_clear_as_timeout`, `run_clear_notification_actions` booleans
      - **NEW**: `on_manual_clear_action` dropdown with 3 options: do_nothing, treat_as_timeout, run_custom
      - **IMPROVED**: Clear logic now uses choose-based branching instead of if/then precedence
      - **FIXED**: Issue #4 - Three separate clear-on-timeout options causing confusion
      - **FIXED**: Issue #5 - Android clear option conflicts with overlapping behavior
      - **FIXED**: Issue #15 - Timeout actions scattered across multiple sections
      - **FIXED**: Issue #16 - Backwards "when disabled" logic in clear handling
      - **FIXED**: Issue #17 - Three-way clear precedence undocumented

      ### Version 2.4.1 - UX Improvements - *11 Feb 2026*
      - **UX**: Reorganized sections for better user experience - merged related settings, created 'What to Send' section for required fields, reduced from 13 to 10 sections
      - **IMPROVED**: Required fields (devices, message) now in prominent "What to Send" section with all content options
      - **IMPROVED**: Merged timeout_settings and timeout_response_config into unified "Timeout Configuration" section
      - **IMPROVED**: Renamed "Links & Behavior" to "Advanced Settings" for clarity
      - **IMPROVED**: Merged notification_content and attachments into "What to Send" section

      ### Version 2.4.0 - Timeout Response Handling - *11 Feb 2026*
      - **MAJOR**: Added timeout response handling for multi-device scenarios
      - **NEW**: Timeout Response Config section - handle timeout events across devices
      - Added: Clear other notifications on timeout (multi-device cleanup)
      - Added: Notify other devices on timeout with customizable message template
      - Added: Clear all notifications on timeout option
      - Added: Run actions for other devices on timeout
      - **REORGANIZED**: Renamed "message_content" → "notification_content" (clearer naming)
      - **ANDROID**: Moved clear notification handling to Android-specific section
      - **ANDROID**: Added treat_clear_as_timeout option (replaces swipe_away_as_timeout)
      - **ANDROID**: Added run_clear_notification_actions option
      - **ANDROID**: Added clear_notification_actions for custom clear behavior
      - Removed: swipe_away_as_timeout from timeout_settings (moved to Android section)
      - Enhanced: Timeout handling now supports multi-device coordination
      - Enhanced: Template variables for timeout scenarios (original_message, timeout_seconds, notified_devices)

      ### Version 2.3.0 - Multi-Device Support - *11 Feb 2026*
      - **MAJOR**: Added multi-device support - send to multiple devices simultaneously
      - **MAJOR**: Added response handling configuration section
      - Added: Single response mode (first device wins, others auto-cleared)
      - Added: Multi response mode (all devices can respond independently)
      - Added: Auto-clear other devices when first responds
      - Added: Notify other devices with customizable template message
      - Added: Run actions for non-responding devices
      - Changed: Device and message inputs moved to top-level (required fields)
      - Changed: Platform-specific payloads built per device (iOS/Android)
      - Enhanced: Response tracking includes responding device name
      - Enhanced: Template variables available in other-device notifications
      - Fixed: iOS tag truncation to 64 bytes (Issue #47)
      - Note: Breaking change - users must re-select devices on update

      ### Version 2026.2.0 - *11 Feb 2026*
      - Changed: Mobile-optimized descriptions for better readability on small screens
      - Changed: Reduced verbosity across all input fields by 40-50%
      - Changed: Consolidated duplicate examples and documentation
      - Changed: Simplified HTML formatting for improved mobile navigation
      - Changed: Stable release (removed Beta designation)

      ### Version 2026.2.0 Multiple Device - *19 Jan 2023*
      - Added: Field for `notification_link`. [#26](https://github.com/samuelthng/t-house-blueprints/pull/26) (Thanks to [HNKNTA](https://github.com/HNKNTA))
      - Fixed: Field `enable_timeout`.
      - Added: `response_variable` with payload and response.

      ### Version 2.0.1 - *20 Dec 2023* [🔗](https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/551552/111?u=samuelthng)

      ### Version 2 - *12 Dec 2023* [🔗](https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/551552/109)

      ### Version 1.6.1 - *26 Oct 2023* [🔗](https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/551552/66)

      ### Version 1.6 - *26 Oct 2023* [🔗](https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/551552/62)

      ### Version 1.5 - *11 Oct 2023* [🔗](https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/551552#version-14-7-jul-2023-8)

      ### Version 1.4 - *7 Jul 2023* [🔗](https://community.home-assistant.io/t/notification-with-confirm-dismiss-and-timeout/551552#version-14-7-jul-2023-8)

