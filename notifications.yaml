 input:
 notify_device:
 name: " Device to notify"
 description: >-
 Select the mobile device that will receive this notification. Device must have the official Home Assistant Companion app installed and configured.


 **Use case:** Send alerts to your personal phone when motion is detected at the front door.


 [Companion App Setup Guide](https://companion.home-assistant.io/docs/notifications/notifications-basic)


 Only used with ` Notification Strategy: Device`

 `Device` is the preferred and default option.
 default: ""
 selector:
 device:
 filter:
 - integration: mobile_app

 message_content:
 name: "Message Content"
 icon: mdi:message-text
 collapsed: true
 input:
 title:
 name: " Title"
 description: "Headline text displayed at the top of the notification. Makes your alert stand out. **Supports Jinja2 templates.**<br><br>**Examples:**<br>  - Static: `Front Door Motion Detected`<br> - Template: `{{ trigger.to_state.attributes.friendly_name }} Alert`<br> - Template: `Motion at {{ now().strftime('%I:%M %p') }}`<br><br>**Use case:** \"Front Door Motion Detected\"<br><br> [Notification Basics](https://companion.home-assistant.io/docs/notifications/notifications-basic)<br><br>`Optional`"
 default: ""
 selector:
 text:
 subtitle:
 name: " Subtitle"
 description: "Secondary text shown below the title. Provides additional context without opening the notification. **Supports Jinja2 templates.**<br><br>**Examples:**<br>  - Static: `Person detected at 3:45 PM`<br> - Template: `{{ states('sensor.front_door_last_detection') }}`<br> - Template: `Detected at {{ now().strftime('%I:%M %p') }}`<br><br>**Use case:** \"Person detected at 3:45 PM\"<br><br> [Notification Basics](https://companion.home-assistant.io/docs/notifications/notifications-basic)<br><br>` iOS Only`, `Optional`"
 default: ""
 selector:
 text:
 message:
 name: " Message"
 description: "Main notification text body. Provides detailed information about the alert. **Supports Jinja2 templates.**<br><br>**Examples:**<br>  - Static: `Motion detected by camera_front_door at 3:45 PM`<br> - Template: `{{ trigger.to_state.attributes.friendly_name }} is {{ trigger.to_state.state }}`<br> - Conditional: `{% if is_state('binary_sensor.front_door', 'on') %}Door is open{% else %}Door is closed{% endif %}`<br><br>**Use case:** \"Motion detected by camera_front_door at 3:45 PM\"<br><br> [Notification Basics](https://companion.home-assistant.io/docs/notifications/notifications-basic) | [HTML Formatting](https://companion.home-assistant.io/docs/notifications/notifications-basic#notification-message-html-formatting)<br><br>`Required`"
 default: ""
 selector:
 text:
 sound:
 name: " Sound"
 description: "Custom sound to play when notification arrives. Helps distinguish different alert types. **Supports Jinja2 templates.**<br><br>**Examples:**<br>  - Static: `alarm.mp3` or `US-EN-Morgan-Freeman.wav`<br> - Template: `{% if is_state('binary_sensor.motion_front_door', 'on') %}alarm.mp3{% else %}notification.mp3{% endif %}`<br> - iOS built-in: `default`, `US-EN-Daisy-Cheerful.wav`<br> - Android: Place files in `/local/` folder<br><br>**Use case:** Use \"alarm.mp3\" for security alerts, default for routine notifications.<br><br> [Notification Sounds Guide](https://companion.home-assistant.io/docs/notifications/notification-sounds)<br><br>`Optional`"
 default: ""
 selector:
 text:

 action_buttons_config:
 name: "Action Buttons Configuration"
 icon: mdi:gesture-tap-button
 collapsed: true
 description: >-
 Configure which action buttons to display on the notification. Action buttons allow users to take immediate action without opening Home Assistant.


 **How to use:**

 1. Enable the buttons you want below (up to 3 buttons)

 2. Configure each enabled button in its respective section

 3. Set button titles, actions, and platform-specific settings


 **Common examples:**

 - Security: "Unlock Door" / "View Camera" / "Dismiss"

 - Climate: "Turn On AC" / "Set to 72°F" / "Dismiss"

 - Lights: "Turn On" / "Turn Off" / "Dim to 50%"


 [Actionable Notifications Guide](https://companion.home-assistant.io/docs/notifications/actionable-notifications)


