    ##############################
    # Template Variables Reference
    ##############################
    #
    # The following template variables are available in various fields throughout this blueprint.
    # Use them in Jinja2 templates to create dynamic, context-aware notifications.
    #
    # ═══════════════════════════════════════════════════════════════════════════════════
    # RESPONSE HANDLING CONTEXT (when another device responds first):
    # ═══════════════════════════════════════════════════════════════════════════════════
    #   • responding_device_name - Name of the device that responded (e.g., "John's iPhone")
    #   • selected_action - Which action was selected ("option_one", "option_two", "option_three")
    #   • action_label - Human-readable label of selected action (e.g., "Confirm", "Dismiss")
    #   • original_message - The original notification message text
    #   • notified_devices - List of all device names that were notified
    #   • non_responding_device - Current device in loop (for actions iterating over devices)
    #
    #   Available in fields:
    #     - other_devices_message_template (Response Handling section)
    #     - other_devices_actions (Response Handling section)
    #
    # ═══════════════════════════════════════════════════════════════════════════════════
    # TIMEOUT CONTEXT (when no response received within timeout duration):
    # ═══════════════════════════════════════════════════════════════════════════════════
    #   • original_message - The original notification message text
    #   • timeout_seconds - Duration of timeout in seconds
    #   • notified_devices - List of all device names that were notified
    #
    #   Available in fields:
    #     - other_devices_timeout_message (Timeout Configuration section)
    #
    # ═══════════════════════════════════════════════════════════════════════════════════
    # MANUAL CLEAR CONTEXT (when Android user swipes notification away):
    # ═══════════════════════════════════════════════════════════════════════════════════
    #   • user_response - Contains response data including 'result': 'notification_cleared'
    #   • device_id - ID of device that cleared the notification (if available)
    #
    #   Available in fields:
    #     - clear_notification_actions (Android Settings section)
    #
    # ═══════════════════════════════════════════════════════════════════════════════════
    # GENERAL TEMPLATE VARIABLES (available everywhere):
    # ═══════════════════════════════════════════════════════════════════════════════════
    #   Standard Home Assistant template variables:
    #     - now() - Current datetime
    #     - states('entity.id') - Get entity state
    #     - state_attr('entity.id', 'attribute') - Get entity attribute
    #     - trigger.* - Access automation trigger data
    #     - And all other Jinja2 template functions
    #
    # ═══════════════════════════════════════════════════════════════════════════════════
    # EXAMPLE TEMPLATES:
    # ═══════════════════════════════════════════════════════════════════════════════════
    #
    #   Response notification:
    #     "{{ responding_device_name }} pressed '{{ action_label }}' at {{ now().strftime('%H:%M') }}"
    #
    #   Timeout notification:
    #     "{{ original_message }} - Timed out after {{ timeout_seconds // 60 }} minutes"
    #
    #   Clear action logging:
    #     service: logbook.log
    #     data:
    #       message: "Notification cleared from {{ device_id }}"
    #
    # ═══════════════════════════════════════════════════════════════════════════════════

    # Input: Response Handling
    ##############################
    response_handling:
      name: "Response Handling"
      icon: mdi:message-reply
      collapsed: true
      description: >-


        **Multi-Device Response Control** - Configure how responses are handled when notifying multiple devices.



        **Use Cases:**

        - Family alert: First person to respond wins, others auto-dismissed

        - Chore acceptance: One person claims task, notify others it's taken

        - Critical alerts: Ensure visibility by keeping notification on other devices


        **📘 Note**: Single-device notifications ignore these settings (only relevant for multiple targets).

      input:
        response_mode:
          name: "🎯 Response Mode"
          description: >-
            Controls whether multiple devices can respond or only the first response is processed.

            <details>
            <summary>Click for mode details</summary>

            **Single Response (Default):**
             - Only the first device's response is processed

             - Subsequent responses from other devices are ignored

             - Best for "first to claim" scenarios (unlock door, accept chore)

             - Options below control what happens to non-responding devices

            **Multi Response:**
             - Every device can respond independently

             - All responses are processed separately

             - Best when each person needs to take action (confirm attendance, rate service)

             - Options below are ignored in this mode

            When set to "Multi Response", all single-device response options below (Auto-Clear, Notify Other Devices, Run Actions) are ignored. Single device notifications: Both modes behave identically.

            </details>

            Default: Single Response
          default: "single"
          selector:
            select:
              options:
                - label: "Single Response (First Wins)"

                  value: "single"
                - label: "Multi Response (All Can Respond)"

                  value: "multi"
        clear_other_notifications:
          name: "🧹 Auto-Clear Other Devices"
          description: >-
            Single Response Mode Only - When first device responds, automatically dismiss notifications on all other devices.

            How it works:
            - Device A responds → notifications on devices B, C, D are cleared

            - Only applies to devices that haven't responded yet

            - Works in conjunction with "Notify Other Devices" below

            Use case: Family alert - Mom responds to unlock door, notification auto-clears from Dad's and kids' phones.

            iOS: Reliable clearing support. Android: Limited - may require user to manually clear in some cases. Ignored in Multi Response mode.

            Default: Enabled
          default: true
          selector:
            boolean:
        notify_other_devices_on_response:
          name: "📢 Notify Other Devices on Response"
          description: >-
            Single Response Mode Only - Send informational notification to other devices when first device responds.

            How it works:
            - Device A responds → new notification sent to devices B, C, D

            - Original notification may be cleared (see "Auto-Clear" above)

            - New notification shows who responded and which action they took

            - Message content customizable via template below

            Use case: "Front door unlocked by John's iPhone" sent to other family members for awareness.

            Tip: Combine with "Auto-Clear" for best user experience (remove old, show new). Ignored in Multi Response mode.

            Default: Disabled
          default: false
          selector:
            boolean:
        other_devices_message_template:
          name: "💬 Other Devices Message Template"
          description: >-
            Requires "Notify Other Devices" enabled - Customize the message sent to non-responding devices. Supports Jinja2 templates.

            <details>
            <summary>Click for template details</summary>

            **Available Template Variables:**
             - `responding_device_name` - Name of the device that responded (e.g., "John's iPhone")

             - `selected_action` - Which action button was pressed (e.g., "option_one", "option_two")

             - `original_message` - The original notification message text

             - `action_label` - Human-readable label of the selected action button

             - Standard HA variables: `now()`, `states()`, etc.

            **Template Examples:**

             - Simple: `Action handled by {{ responding_device_name }}`

             - With action: `{{ responding_device_name }} pressed "{{ action_label }}"`

             - Detailed: `{{ original_message }} - {{ selected_action }} by {{ responding_device_name }}`

             - Time-stamped: `Handled by {{ responding_device_name }} at {{ now().strftime('%H:%M') }}`

            Template errors fall back to default message. Ignored in Multi Response mode.

            </details>

            Default: "Action handled by {{ responding_device_name | default('another device') }}"
          default: "Action handled by {{ responding_device_name | default('another device') }}"
          selector:
            text:
              multiline: true
        run_actions_for_others_on_response:
          name: "⚙️ Run Actions for Other Devices"
          description: >-
            Single Response Mode Only - Execute custom actions for devices that didn't respond when first device responds.

            <details>
            <summary>Click for details</summary>

            **How it works:**
             - Device A responds → actions run once for each device (B, C, D) that didn't respond

             - Useful for logging, tracking, or follow-up automation

             - Actions defined in "Actions for Other Devices" below

            **Use Cases:**
             - Log which devices were notified but didn't respond

             - Update dashboard showing who hasn't acknowledged

             - Send reminder to specific devices after timeout

             - Track response rates for analytics

            Tip: Combine with timeout actions for comprehensive tracking. Ignored in Multi Response mode.

            </details>

            Default: Disabled
          default: false
          selector:
            boolean:
        other_devices_actions:
          name: "⚙️ Actions for Other Devices"
          description: >-
            Requires "Run Actions for Others" enabled - Define actions to execute for each non-responding device.

            <details>
            <summary>Click for template variables and examples</summary>

            **Available Template Variables:**
             - `responding_device_name` - Device that responded first

             - `selected_action` - Which action button was pressed

             - `notified_devices` - List of all device names that were notified

             - `non_responding_device` - Current device in the loop (use in templates)

             - `action_label` - Human-readable label of selected action

            **Action Examples:**

            Log to history:
            ```yaml
            - service: logbook.log

              data:
                name: "Notification Response"
                message: "{{ non_responding_device }} did not respond. Handled by {{ responding_device_name }}"
            ```

            Update input boolean:
            ```yaml
            - service: input_boolean.turn_on

              target:
                entity_id: input_boolean.{{ non_responding_device | slugify }}_missed_alert
            ```

            Send follow-up notification:
            ```yaml
            - service: notify.mobile_app_{{ non_responding_device | slugify }}

              data:
                message: "Alert was handled by {{ responding_device_name }}"
            ```

            Ignored in Multi Response mode.

            </details>

            Optional
          default: []
          selector:
            action:


    ##############################
    # Input: Timeout Response Handling
    ##############################

    timeout_configuration:
      name: "Timeout Configuration"
      icon: mdi:timer-cog-outline
      collapsed: true
      description: >-


        **Timeout Settings** - Control how long to wait for user response and what happens when time expires.




      input:
        enable_timeout:
          name: "⌛️ Enable Timeout"
          description: >-
            Require script to stop listening after the set duration.

            Recommended to enable. If disabled, script will wait for response indefinitely until the next time it is triggered.
          default: true # Default `true` for backward compatibility.
          selector:
            boolean:
        timeout:
          name: "⌛️ Timeout Duration"
          description: >-
            How long to wait for user response before executing timeout actions.

            Use case: Wait 5 minutes for response to door unlock request, 30 seconds for garage closing confirmation.

            Recommended: ≥1 minute for reliable notification delivery.

            📖 [Actionable Notifications](https://companion.home-assistant.io/docs/notifications/actionable-notifications) | Default: 15 minutes
          default:
            hours: 0
            minutes: 15
            seconds: 0
          selector:
            duration:
              enable_day: false
        run_timeout_actions:
          name: "⌛️ Enable Timeout Action(s)"
          description: >-
            Run timeout actions upon a timeout event.

            Recommended to enable. If disabled, script will timeout without executing any timeout actions.
          default: true # Default `true` for backward compatibility.
          selector:
            boolean:
        timeout_action:
          name: "⌛️ Timeout Action(s)"
          description: >-
            Action to run when notification response is timed out.

            Leave empty if no actions should be run.

            Android Users: Note, URI options do not stop the timeout countdown. This action could be run after pressing the URI option. Workaround: you may disable Run timeout action(s) when notification cleared and manually clear the notification after selecting your URI option.

            Optional
          default: []
          selector:
            action:
        clear_behavior_on_timeout:
          name: "🧹 Clear notifications on timeout"
          selector:
            select:
              options:
                - label: "Keep all notifications visible"

                  value: "keep_all"
                - label: "Clear this device only"

                  value: "clear_this"
                - label: "Clear other devices (keep this one)"

                  value: "clear_others"
                - label: "Clear ALL devices"

                  value: "clear_all"
          default: "keep_all"
          description: >-
            What to do with notifications when timeout occurs.

            iOS: Full support for all options. Android: Limited clearing support.

            Multi-device only: clear_others and clear_all

            Use cases:
            • Emergency alert expires → clear_all to remove from all phones
            • Time-sensitive request → clear_this to clean up after timeout
            • Multi-device coordination → clear_others to remove from non-responding devices
        notify_other_devices_on_timeout:
          name: "📢 Notify Other Devices on Timeout"
          description: >-
            Multi-Device Only - Send informational notification to all devices when timeout occurs.

            Example: "Door unlock request timed out - no response received" sent to all family members.

            Default: Disabled
          default: false
          selector:
            boolean:
        other_devices_timeout_message:
          name: "💬 Other Devices Timeout Message"
          description: >-
            Requires "Notify Other Devices on Timeout" enabled - Message sent when timeout occurs. Supports Jinja2 templates.

            Available variables:

             - `original_message`: The original notification message

             - `timeout_seconds`: Duration of the timeout in seconds

             - `notified_devices`: List of all notified device names

            Examples:

             - Simple: `No response received - request timed out`

             - Detailed: `{{ original_message }} - Timed out after {{ timeout_seconds // 60 }} minutes`

            Default: "No response received - timed out"
          default: "No response received - timed out"
          selector:
            text:
              multiline: true

    advanced_settings:
      name: "Advanced Settings"
      icon: mdi:cog-outline
      collapsed: true
      description: >-


        Configure notification link, tag, and grouping options.




      input:
        notification_link:
          name: "🔗 Notification Link"
          description: >-
            Link to navigate to when tapping the notification without using action buttons.

            When this is used: Opens when user taps the notification body (not the action buttons).
            Note: Action buttons use separate `option_*_uri` fields for their links.

            Supports Jinja2 templates.


            <details>
            <summary>Click for examples</summary>

            **Examples:**

             - Dashboard: `/lovelace/cameras` - View all cameras dashboard

             - Dashboard: `/lovelace/security` - Security dashboard

             - Entity view: `entityId:camera.front_door` - View front door camera

             - Template: `/lovelace/{{ trigger.entity_id.split('.')[1] }}`

             - Home Assistant views: `/config/updates` or `/lovelace/home`

             - Apps: `app://<package name>`

             - Deep links: `deep-link://<deep_link>`

            </details>

            📖 [Opening a URL Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic/#opening-a-url) | Optional
          default: ""
          selector:
            text:
        ##############################
        # Input: Attachments
        ##############################
        tag:
          name: "🔖 Tag"
          description: >-
            Used to uniquely identify the notification.

            Use tag if you are using this script with other notification services. Leave empty otherwise.

            Example: `my_awesome_notification_for_device_X`

            Recommended to leave empty.

            Optional
          default: ""
          selector:
            text:
        group:
          name: "📣 Notification Group ID"
          description: >-
            Used for grouping different notifications together visually.

            iOS critical notifications do not support grouping.

            📖 [Documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic?_highlight=tag#grouping) | Optional
          default: ""
          selector:
            text:

    ios_settings:
      name: "iOS Specific Settings"
      icon: mdi:apple
      collapsed: true
      description: >-


        iOS-only features like thread ID and presentation options.




      input:
        thread_id:
          name: "🧵 Thread ID"
          description: >-
            Groups notifications into conversation threads.

            Example: `front-door-events` groups all front door alerts.

            📖 [Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic#thread-id-grouping-notifications) | 🍎 iOS Only | Optional
          default: ""
          selector:
            text:
        presentation_options:
          name: "🎨 Presentation Options"
          description: >-
            Controls what shows when app is open. Options: banner, sound, badge, list.

            📖 [Docs](https://companion.home-assistant.io/docs/notifications/notifications-basic#presentation-options) | 🍎 iOS Only | Optional
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: "Banner"

                  value: "banner"
                - label: "Sound"

                  value: "sound"
                - label: "Badge"

                  value: "badge"
                - label: "List"

                  value: "list"

    android_settings:
      name: "Android Specific Settings"
      icon: mdi:android
      collapsed: true
      description: >-


        Android-only features like notification channels, LED colors, and vibration patterns.




      input:
        on_manual_clear_action:
          name: "🧹 When notification swiped away"
          selector:
            select:
              options:
                - label: "Do nothing"

                  value: "do_nothing"
                - label: "Treat as timeout (run timeout actions)"

                  value: "treat_as_timeout"
                - label: "Run separate actions"

                  value: "run_custom"
          default: "do_nothing"
          description: >-
            What happens when user swipes notification away.

            This setting is ignored (disabled) when notification is persistent OR sticky.

            Multi-device note: In mixed iOS/Android setups, "treat as timeout" applies globally to all clear events.

            🤖 Android Only
        clear_notification_actions:
          name: "⚙️ Actions on manual clear"
          selector:
            action:
          default: []
          description: >-
            Only used when "When notification swiped away" is set to "Run separate actions". Ignored for all other values.

            Available variables:
            - `user_response`: Contains response data including 'result': 'notification_cleared'

            - `device_id`: ID of device that cleared the notification (if available)

            Examples:

             - Log to history

             - Update input_boolean

             - Send analytics

            🤖 Android Only | Optional
        importance:
          name: "❕ Notification Channel Importance"
          description: >-
            Controls notification priority on Android. Similar to iOS interruption_level but for Android platform.

            📖 [Notification Channel Importance](https://companion.home-assistant.io/docs/notifications/notifications-basic/#notification-channel-importance) | 🤖 Android Only | Optional
          default: default
          selector:
            select:
              options:
                - label: "Urgent (Makes a sound with heads-up notification)"

                  value: high
                - label: "Default (Makes a sound)"

                  value: default
                - label: "Silent (Makes no sound)"

                  value: low
                - label: "Low (Makes no sound, doesn't appear in status bar)"

                  value: min
        channel:
          name: "📣 Notification Channel"
          description: >-
            Defines the notification channel on Android. Used with importance setting to control notification behavior.

            📖 [Notification Channels](https://companion.home-assistant.io/docs/notifications/notifications-basic/#notification-channels) | 🤖 Android Only | Optional
          default: "Home Assistant"
          selector:
            text:
        android_high_priority:
          name: "❕ High Priority Mode"
          description: >-
            Workaround to ensure notifications are delivered in timely fashion. This will override the Notification Channel Importance with `importance: high`, and set `ttl: 0`.

            🤖 Android Only | Optional
          default: true
          selector:
            boolean:
        sticky:
          name: "📌 Sticky"
          description: >-
            Prevents notification from being dismissed until action buttons are used.

            Difference from Persistent:
            - Sticky: Can be dismissed only via action buttons (this option)

            - Persistent: Cannot be dismissed at all (above)

            When enabled, manual clear action handling is disabled. The "When notification swiped away" setting is ignored.

            Use case: "Water Leak Detected" or "Smoke Alarm" notifications that require explicit acknowledgment via action buttons.

            📖 [Sticky Notifications](https://companion.home-assistant.io/docs/notifications/notifications-basic#sticky) | 🤖 Android Only | Optional
          default: false
          selector:
            boolean:
        persist:
          name: "🚩 Persistent Notification"
          description: >-
            Makes notification non-dismissible - cannot be swiped away by user at all.

            Difference from Sticky:
            - Persistent: Cannot be dismissed (this option)

            - Sticky: Can be dismissed only via action buttons (below)

            When enabled, manual clear action handling is disabled. The "When notification swiped away" setting is ignored.

            Use case: System-critical alerts that must remain until resolved programmatically.

            📖 [Persistent Notifications](https://companion.home-assistant.io/docs/notifications/notifications-basic/#persistent-notification) | 🤖 Android Only | Optional
          default: false
          selector:
            boolean:
        visibility:
          name: "🔏 Notification Lockscreen Visibility"
          description: >-
            Show or hide notification content on the lockscreen.

            📖 [Lockscreen Visibility](https://companion.home-assistant.io/docs/notifications/notifications-basic?_highlight=tag#notification-sensitivity--lock-screen-visibility) | 🤖 Android Only | Default: Private | Optional
          default: "private"
          selector:
            select:
              options:
                - label: "Public: Always show content."

                  value: public
                - label: "Private: Show content based on phone settings."

                  value: private
                - label: "Secret: Always hide content on the lockscreen."

                  value: secret


        vibration_pattern:
          name: "📳 Vibration Pattern"
          description: >-
            Custom vibration sequence in milliseconds. Helps identify notification type without looking at phone.

            Examples:

             - "100,200,100,200" - Quick double buzz for routine alerts

             - "0,500,200,500" - Long-short-long for urgent alerts

             - "100,100,100,100,100,100" - Rapid pulses for security

            Format: wait,vibrate,wait,vibrate (in milliseconds)

            📖 [Vibration Patterns](https://companion.home-assistant.io/docs/notifications/notifications-basic#notification-vibration-pattern) | 🤖 Android Only | Optional
          default: ""
          selector:
            text:
        led_color:
          name: "💡 LED Color"
          description: >-
            Notification LED color for devices with LED indicators. Provides visual notification when screen is off.

            Examples:

             - "red" - Critical/security alerts

             - "blue" - Information/status updates

             - "#00FF00" - Success/all-clear (hex green)

             - "orange" - Warnings

            Use case: Red LED for alarm triggers, blue for routine door alerts.

            Only works on devices with notification LED.

            📖 [LED Color](https://companion.home-assistant.io/docs/notifications/notifications-basic#notification-led-color) | 🤖 Android Only | Optional
          default: ""
          selector:
            text:
        alert_once:
          name: "🔕 Alert Once"
          description: >-
            Play sound and vibrate only for initial notification, not for updates. Prevents notification spam for frequently updating alerts.

            Use case: Motion sensor that updates every few seconds, or temperature alerts that change gradually.

            📖 [Alert Once](https://companion.home-assistant.io/docs/notifications/notifications-basic#alert-once) | 🤖 Android Only | Optional
          default: false
          selector:
            boolean:

        car_ui:
          name: "🚘 Show on Android Auto"
          description: >-
            Display notification on Android Auto interface when connected to vehicle.

            🤖 Android Only | Optional
          default: false
          selector:
            boolean:

sequence:
  ##############################
  # Setup Variables
  ##############################
  - alias: Basic Notification Content

    variables:
      # Title
      title: !input title

      # Subtitle
      subtitle: !input subtitle

      # Message
      message: !input message

      # Sound
      sound: !input sound

  - alias: Common Configuration Options

    variables:
      # [Opening a URL] - https://companion.home-assistant.io/docs/notifications/notifications-basic/#opening-a-url
      notification_link: !input notification_link

      # [Tag]
      custom_tag: !input tag # No need for manual definition anymore, treat existing definitions as custom tags.
      tag: "{{ iif(custom_tag|length, custom_tag, (this.entity_id ~ '-' ~ context.id)) | truncate(64, killwords=True, end='') }}"

      # [Grouping]
      group: !input group

  - alias: Android Configuration Options

    variables:
      channel: !input channel
      visibility: !input visibility
      importance: !input importance
      persist: !input persist
      car_ui: !input car_ui

      # New Phase 1 features
      sticky: !input sticky
      vibration_pattern: !input vibration_pattern
      led_color: !input led_color
      alert_once: !input alert_once

      # [Notification Banner Icon]
      notification_icon: !input icon
      enable_icon_color: !input enable_icon_color
      icon_color_selector: !input icon_color
      icon_color_hex: '{{ "#{:02x}{:02x}{:02x}".format(icon_color_selector[0], icon_color_selector[1], icon_color_selector[2]) }}'
      android_high_priority: !input android_high_priority

      # Android clear notification handling (v3.0 - consolidated)
      on_manual_clear_action: !input on_manual_clear_action
      clear_notification_actions: !input clear_notification_actions

  - alias: iOS Configuration Options

    variables:
      interruption_level: !input interruption_level

      # New Phase 1 features
      badge: !input badge
      thread_id: !input thread_id
      presentation_options: !input presentation_options
      # shortcut: !input shortcut # Unlikely to be supported due to complexity.
      # [Critical Notifications] - https://companion.home-assistant.io/docs/notifications/critical-notifications
      # critical: !input critical
      # volume: !input volume

  - alias: Timeout

    variables:
      enable_timeout: !input enable_timeout
      clear_behavior_on_timeout: !input clear_behavior_on_timeout
      timeout: !input timeout
      timeout_seconds: "{{ (timeout.hours * 60 + timeout.minutes) * 60 + timeout.seconds }}"
      run_timeout_actions: !input run_timeout_actions

  - alias: Timeout Response Handling Configuration

    variables:
      notify_other_devices_on_timeout: !input notify_other_devices_on_timeout
      other_devices_timeout_message: !input other_devices_timeout_message

  - alias: Attachments

    variables:
      attachment_type: !input attachment_type
      attachment_camera_entity: !input attachment_camera_entity

      # New Phase 1 features
      image_url: !input image_url
      video_url: !input video_url

      camera_image_url: >-
        {% if (attachment_camera_entity|length) %}
          {% if (state_attr(attachment_camera_entity,'entity_picture')|length) %}
            {{state_attr(attachment_camera_entity,'entity_picture')}}
          {% else %}
            {{"/api/camera_proxy/{id}".format(id=attachment_camera_entity)}}
          {%- endif %}
        {%- endif %}
      media_url: >-
        {{
          {
            'none': '',
            'camera_entity': iif(camera_image_url | length, camera_image_url)
          }.get(attachment_type)
        }}

  - alias: Device Configuration

    variables:
      notify_device: !input notify_device
      # Multi-device support: Convert single device or list of devices to a proper list
      notify_devices_list: >-
        {% if notify_device is string %}
          {{ [notify_device] }}
        {% elif notify_device is iterable %}
          {{ notify_device | list }}
        {% else %}
          {{ [notify_device] }}
        {% endif %}
      # Build device information for each device
      devices_info: >-
        {% set devices = namespace(list=[]) %}
        {% for device_id in notify_devices_list %}
          {% set device_name = device_attr(device_id, 'name') %}
          {% if device_name is not none %}
            {% set device_manufacturer = device_attr(device_id, 'manufacturer') | default('') | upper %}
            {% set is_apple = 'APPLE' in device_manufacturer %}
            {% set service_name = "notify.mobile_app_{id}".format(id=device_name|slugify) %}
            {% set devices.list = devices.list + [{
              'device_id': device_id,
              'device_name': device_name|slugify,
              'is_apple': is_apple,
              'service_name': service_name
            }] %}
          {% endif %}
        {% endfor %}
        {{ devices.list }}
      # For backwards compatibility - use first device if only one selected
      notify_service: >-
        {% if devices_info | length == 1 %}
          {{ devices_info[0].service_name }}
        {% else %}
          {{ "notify.mobile_app_{id}".format(id=device_attr(notify_devices_list[0],'name')|slugify) }}
        {% endif %}

  - alias: Response Handling Configuration

    variables:
      response_mode: !input response_mode
      clear_other_notifications: !input clear_other_notifications
      notify_other_devices_on_response: !input notify_other_devices_on_response
      other_devices_message_template: !input other_devices_message_template
      run_actions_for_others_on_response: !input run_actions_for_others_on_response
      other_devices_actions: !input other_devices_actions
      # Track if we're in multi-device scenario
      is_multi_device: "{{ devices_info | length > 1 }}"
      # For single response mode, we'll track the responding device
      responding_device_name: ""

  - alias: Option 1

    variables:
      first_option: "{{ 'FIRST_' ~ context.id }}"
      option_one_enabled: !input option_one_enabled
      option_one_title: !input option_one_text
      option_one_mode: !input option_one_mode
      option_one_actions: !input option_one_action
      option_one_uri: !input option_one_uri
      option_one_icon_value: !input option_one_icon
      option_one_icon: >-
        {% if 'sfsymbols:' in option_one_icon_value %}
        {{ option_one_icon_value }}
        {% elif option_one_icon_value | length %}
        {{ "sfsymbols:{icon}".format(icon=option_one_icon_value) }}
        {%- endif %}
      option_one_is_destructive: !input option_one_is_destructive
      option_one_auth_required: !input option_one_authentication_required
      option_one_action: >-
        {% if option_one_mode == 'uri' %}
        {{ 'URI' }}
        {% else %}
        {{ first_option }}
        {% endif %}
      option_one: >-
        {{ {
          'enabled': option_one_enabled,
          'action': option_one_action,
          'title': option_one_title,
          'actions': option_one_actions,
          'icon': option_one_icon,
          'destructive': option_one_is_destructive,
          'authenticationRequired': option_one_auth_required,
          "{}".format('uri' if option_one_uri|length else ''): option_one_uri,
        } }}

  - alias: Option 2

    variables:
      second_option: "{{ 'SECOND_' ~ context.id }}"
      option_two_enabled: !input option_two_enabled
      option_two_title: !input option_two_text
      option_two_mode: !input option_two_mode
      option_two_actions: !input option_two_action
      option_two_uri: !input option_two_uri
      option_two_icon_value: !input option_two_icon
      option_two_icon: >-
        {% if 'sfsymbols:' in option_two_icon_value %}
        {{ option_two_icon_value }}
        {% elif option_two_icon_value | length %}
        {{ "sfsymbols:{icon}".format(icon=option_two_icon_value) }}
        {%- endif %}
      option_two_is_destructive: !input option_two_is_destructive
      option_two_auth_required: !input option_two_authentication_required
      option_two_action: >-
        {% if option_two_mode == 'uri' %}
        {{ 'URI' }}
        {% else %}
        {{ second_option }}
        {% endif %}
      option_two: >-
        {{ {
          'enabled': option_two_enabled,
          'action': option_two_action,
          'title': option_two_title,
          'actions': option_two_actions,
          'icon': option_two_icon,
          'destructive': option_two_is_destructive,
          'authenticationRequired': option_two_auth_required,
          "{}".format('uri' if option_two_uri|length else ''): option_two_uri,
        } }}

  - alias: Option 3

    variables:
      third_option: "{{ 'THIRD_' ~ context.id }}"
      option_three_enabled: !input option_three_enabled
      option_three_title: !input option_three_text
      option_three_mode: !input option_three_mode
      option_three_actions: !input option_three_action
      option_three_uri: !input option_three_uri
      option_three_icon_value: !input option_three_icon
      option_three_icon: >-
        {% if 'sfsymbols:' in option_three_icon_value %}
        {{ option_three_icon_value }}
        {% elif option_three_icon_value | length %}
        {{ "sfsymbols:{icon}".format(icon=option_three_icon_value) }}
        {%- endif %}
      option_three_is_destructive: !input option_three_is_destructive
      option_three_auth_required: !input option_three_authentication_required
      option_three_action: >-
        {% if option_three_mode == 'uri' %}
        {{ 'URI' }}
        {% else %}
        {{ third_option }}
        {% endif %}
      option_three: >-
        {{ {
          'enabled': option_three_enabled,
          'action': option_three_action,
          'title': option_three_title,
          'actions': option_three_actions,
          'icon': option_three_icon,
          'destructive': option_three_is_destructive,
          'authenticationRequired': option_three_auth_required,
          "{}".format('uri' if option_three_uri|length else ''): option_three_uri,
        } }}

  - alias: Setup Payload

    variables:
      options: >-
        {{ [option_one, option_two, option_three] | selectattr('enabled') | list }}
      expect_response: "{{ enable_timeout or option_one_enabled or option_two_enabled or option_three_enabled }}" # If there's no timeout nor options, then no point waiting. Stop script.
      # Build common notification data (will be customized per device platform)
      common_data: >-
        {% set common = namespace(data={}) %}
        {# Common fields for all platforms #}
        {% set common.data = dict(common.data, **{ 'actions': options }) %}
        {% set common.data = dict(common.data, **{ 'tag': tag }) %}
        {% if group|length %}{% set common.data = dict(common.data, **{ 'group': group }) %}{% endif %}
        {{ common.data }}

  ##############################
  # Send Notification
  ##############################
  - alias: "Send notifications to all devices"

    repeat:
      for_each: "{{ devices_info }}"
      sequence:
        - variables:

            current_device: "{{ repeat.item }}"
            current_device_id: "{{ repeat.item.device_id }}"
            is_apple: "{{ repeat.item.is_apple }}"
            service_name: "{{ repeat.item.service_name }}"
            # Build platform-specific payload for this device
            notification_data: >-
              {% set payload = namespace(data=common_data.copy()) %}
              {% set payload.data = dict(payload.data, **{ 'apple_device': is_apple }) %}
              {% if is_apple %}
                {# iOS #}
                {% set push = namespace(d={}) %}
                {% set payload.data = dict(payload.data, **{ 'subtitle': subtitle }) %}
                {% set push.d = dict(push.d, **{ 'interruption-level': interruption_level }) %}
                {% if notification_link|length %}{% set payload.data = dict(payload.data, **{ 'url': notification_link }) %}{% endif %}
                {% if attachment_type == 'camera_entity' %}{% set payload.data = dict(payload.data, **{ 'entity_id': attachment_camera_entity }) %}{% endif %}
                {% if sound|length %}{% set push.d = dict(push.d, **{ 'sound': sound }) %}{% endif %}
                {% if badge is not none and badge != '' %}{% set payload.data = dict(payload.data, **{ 'badge': badge|int }) %}{% endif %}
                {% if thread_id|length %}{% set payload.data = dict(payload.data, **{ 'thread-id': thread_id }) %}{% endif %}
                {% if presentation_options|length %}{% set push.d = dict(push.d, **{ 'presentation-options': presentation_options }) %}{% endif %}
                {% if image_url|length %}{% set payload.data = dict(payload.data, **{ 'image': image_url }) %}{% endif %}
                {% if video_url|length %}{% set payload.data = dict(payload.data, **{ 'video': video_url }) %}{% endif %}
                {% set payload.data = dict(payload.data, **{ 'push': push.d }) %}
              {% else %}
                {# Android - Filter out iOS-only action fields #}
                {% set android_actions = [] %}
                {% for action in payload.data.actions %}
                  {% set android_action = {'action': action.action, 'title': action.title} %}
                  {% if action.uri is defined and action.uri|length %}{% set android_action = dict(android_action, **{'uri': action.uri}) %}{% endif %}
                  {% set android_actions = android_actions + [android_action] %}
                {% endfor %}
                {% set payload.data = dict(payload.data, **{ 'actions': android_actions }) %}
                {% set payload.data = dict(payload.data, **{ 'subject': subtitle }) %}
                {% set payload.data = dict(payload.data, **{ 'visibility': visibility }) %}
                {% set payload.data = dict(payload.data, **{ 'importance': importance }) %}
                {% if android_high_priority %}{% set payload.data = dict(payload.data, **{ 'priority': 'high', 'ttl': 0 }) %}{% endif %}
                {% if notification_link|length %}{% set payload.data = dict(payload.data, **{ 'clickAction': notification_link }) %}{% endif %}
                {% if attachment_type == 'camera_entity' and (media_url|length) %}{% set payload.data = dict(payload.data, **{ 'image': media_url }) %}{% endif %}
                {% if notification_icon|length %}{% set payload.data = dict(payload.data, **{ 'notification_icon': notification_icon }) %}{% endif %}
                {% if enable_icon_color %}{% set payload.data = dict(payload.data, **{ 'color': icon_color_hex }) %}{% endif %}
                {% if enable_timeout and clear_behavior_on_timeout == 'clear_this' %}{% set payload.data = dict(payload.data, **{ 'timeout': timeout_seconds }) %}{% endif %}
                {% if channel|length %}{% set payload.data = dict(payload.data, **{ 'channel': channel }) %}{% endif %}
                {% if persist %}{% set payload.data = dict(payload.data, **{ 'persistent': persist }) %}{% endif %}
                {% if car_ui %}{% set payload.data = dict(payload.data, **{ 'car_ui': car_ui }) %}{% endif %}
                {% if sound|length %}{% set payload.data = dict(payload.data, **{ 'sound': sound }) %}{% endif %}
                {% if sticky %}{% set payload.data = dict(payload.data, **{ 'sticky': sticky }) %}{% endif %}
                {% if vibration_pattern|length %}{% set payload.data = dict(payload.data, **{ 'vibration_pattern': vibration_pattern }) %}{% endif %}
                {% if led_color|length %}{% set payload.data = dict(payload.data, **{ 'led_color': led_color }) %}{% endif %}
                {% if alert_once %}{% set payload.data = dict(payload.data, **{ 'alert_once': alert_once }) %}{% endif %}
                {% if image_url|length %}{% set payload.data = dict(payload.data, **{ 'image': image_url }) %}{% endif %}
                {% if video_url|length %}{% set payload.data = dict(payload.data, **{ 'video': video_url }) %}{% endif %}
              {% endif %}
              {{ payload.data }}
        - alias: "Send notification to {{ repeat.item.device_name }}"

          service: "{{ service_name }}"
          data:
            title: "{{ title }}"
            message: "{{ message }}"
            data: "{{ notification_data }}"

  ##############################
  # Evaluate Response
  ##############################
  - alias: Determine if script has to wait for response?

    choose:
      - alias: "No need for response"

        conditions: "{{ expect_response == false }}"
        sequence: []
      - alias: "Should await response with timeout?"

        conditions: "{{ enable_timeout }}"
        sequence:
          - alias: "Awaiting response with timeout…"

            wait_for_trigger:
              - platform: event

                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ first_option }}"
              - platform: event

                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ second_option }}"
              - platform: event

                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ third_option }}"
              - platform: event

                event_type: mobile_app_notification_cleared
                event_data:
                  tag: "{{ tag }}"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
      - alias: "Should await response indefinitely?"

        conditions: "{{ enable_timeout == false }}"
        sequence:
          - alias: "Awaiting response indefinitely…"

            wait_for_trigger:
              - platform: event

                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ first_option }}"
              - platform: event

                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ second_option }}"
              - platform: event

                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ third_option }}"
              - platform: event

                event_type: mobile_app_notification_cleared
                event_data:
                  tag: "{{ tag }}"

  ##############################
  # Parse user response
  ##############################
  - alias: "Parse response into variable"

    variables:
      user_response: >-
        {% set response = namespace(data={ 'payload': notification_data }) %}
        {% if not expect_response %}
        {% set response.data = dict(response.data, **{ 'result': "no_response" }) %}
        {% elif run_timeout_actions and wait.trigger == none %}
        {% set response.data = dict(response.data, **{ 'result': "timeout" }) %}
        {% elif run_timeout_actions and on_manual_clear_action == 'treat_as_timeout' and wait.trigger is not none and wait.trigger.event is not none and wait.trigger.event.event_type == 'mobile_app_notification_cleared' %}
        {% set response.data = dict(response.data, **{ 'result': "notification_cleared" }) %}
        {% elif wait.trigger is not none and wait.trigger.event is not none and wait.trigger.event.data is not none and wait.trigger.event.data.action == first_option %}
        {% set response.data = dict(response.data, **{ 'result': "option_one" }) %}
        {% elif wait.trigger is not none and wait.trigger.event is not none and wait.trigger.event.data is not none and wait.trigger.event.data.action == second_option %}
        {% set response.data = dict(response.data, **{ 'result': "option_two" }) %}
        {% elif wait.trigger is not none and wait.trigger.event is not none and wait.trigger.event.data is not none and wait.trigger.event.data.action == third_option %}
        {% set response.data = dict(response.data, **{ 'result': "option_three" }) %}
        {%- endif %}
        {# Add device info if available #}
        {% if wait.trigger is defined and wait.trigger.event is defined and wait.trigger.event.data.device_id is defined %}
        {% set response.data = dict(response.data, **{ 'device_id': wait.trigger.event.data.device_id }) %}
        {% endif %}
        {{ response.data }}
      responding_device_name: >-
        {% if user_response.device_id is defined %}
          {% set name = device_attr(user_response.device_id, 'name') %}
          {{ name if name is not none else 'unknown device' }}
        {% else %}
          unknown device
        {% endif %}

  ##############################
  # Handle Multi-Device Response
  ##############################
  - alias: "Handle other devices (single response mode)"

    choose:
      - alias: "Single response mode with multiple devices"

        conditions:
          - "{{ is_multi_device }}"

          - "{{ response_mode == 'single' }}"

          - "{{ user_response.result in ['option_one', 'option_two', 'option_three'] }}"

        sequence:
          # Clear notifications on other devices
          - choose:

              - conditions: "{{ clear_other_notifications }}"

                sequence:
                  - alias: "Clear notifications on other devices"

                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - choose:

                            - conditions: "{{ repeat.item.device_id != user_response.device_id }}"

                              sequence:
                                - service: "{{ repeat.item.service_name }}"

                                  data:
                                    message: "clear_notification"
                                    data:
                                      tag: "{{ tag }}"

          # Notify other devices
          - choose:

              - conditions: "{{ notify_other_devices_on_response }}"

                sequence:
                  - alias: "Send notification to other devices"

                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - choose:

                            - conditions: "{{ repeat.item.device_id != user_response.device_id }}"

                              sequence:
                                - service: "{{ repeat.item.service_name }}"

                                  data:
                                    title: "{{ title }}"
                                    message: >-
                                      {% set original_message = message %}
                                      {{ other_devices_message_template }}
                                    data:
                                      tag: "{{ tag }}_handled"

          # Run actions for other devices
          - choose:

              - conditions: "{{ run_actions_for_others_on_response }}"

                sequence:
                  - alias: "Run actions for each non-responding device"

                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - choose:

                            - conditions: "{{ repeat.item.device_id != user_response.device_id }}"

                              sequence: !input other_devices_actions


  ##############################
  # Handle Multi-Device Timeout Response
  ##############################
  - alias: "Handle timeout for multi-device scenarios"

    choose:
      - alias: "Timeout occurred with multiple devices"

        conditions:
          - "{{ is_multi_device }}"

          - "{{ user_response.result == 'timeout' }}"

        sequence:
          # Clear notifications based on clear_behavior_on_timeout
          - choose:

              - conditions: "{{ clear_behavior_on_timeout == 'clear_all' }}"

                sequence:
                  - alias: "Clear notifications on ALL devices"

                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - service: "{{ repeat.item.service_name }}"

                          data:
                            message: "clear_notification"
                            data:
                              tag: "{{ tag }}"
              - conditions: "{{ clear_behavior_on_timeout == 'clear_others' }}"

                sequence:
                  # clear_others not applicable in timeout scenario (no responding device to exclude)
                  # This behaves as keep_all - notifications remain on all devices
                  []

          # Notify devices about timeout
          - choose:

              - conditions: "{{ notify_other_devices_on_timeout }}"

                sequence:
                  - alias: "Send timeout notification to all devices"

                    repeat:
                      for_each: "{{ devices_info }}"
                      sequence:
                        - service: "{{ repeat.item.service_name }}"

                          data:
                            title: "{{ title }}"
                            message: >-
                              {% set original_message = message %}
                              {% set notified_devices = devices_info | map(attribute='device_name') | list %}
                              {{ other_devices_timeout_message }}
                            data:
                              tag: "{{ tag }}_timeout"

  ##############################
  # Trigger Response Actions
  ##############################
  - alias: "Run response actions"

    default: []
    choose:
      - alias: "Trigger: Timeout"

        conditions: "{{ user_response.result == 'timeout' }}"
        sequence: !input timeout_action # "{{ timeout_actions }}"
      - alias: "Trigger: Notification Cleared"

        conditions: "{{ user_response.result == 'notification_cleared' }}"
        sequence:
          - choose:
              # If on_manual_clear_action is 'treat_as_timeout', run timeout actions
              - conditions: "{{ on_manual_clear_action == 'treat_as_timeout' }}"

                sequence: !input timeout_action
              # If on_manual_clear_action is 'run_custom', run clear actions
              - conditions: "{{ on_manual_clear_action == 'run_custom' }}"

                sequence: !input clear_notification_actions
            # Default: do_nothing - no actions run
      - alias: "Trigger: first_option"

        conditions: "{{ user_response.result == 'option_one' }}"
        sequence: !input option_one_action # "{{ option_one_actions }}"
      - alias: "Trigger: second_option"

        conditions: "{{ user_response.result == 'option_two' }}"
        sequence: !input option_two_action # "{{ option_two_actions }}"
      - alias: "Trigger: third_option"

        conditions: "{{ user_response.result == 'option_three' }}"
        sequence: !input option_three_action # "{{ option_three_actions }}"

  ##############################
  # Compatibility: iOS Clear Notification
  ##############################
  - alias: "Send clear notification commands"

    if:
      - alias: "Should send clear notification command? (for iOS/macOS)?"

        condition: template
        value_template: "{{ user_response.result == 'timeout' and clear_behavior_on_timeout == 'clear_this' and devices_info | selectattr('is_apple') | list | length > 0 }}"
    then:
      - alias: "Send clear notification command to iOS devices"

        repeat:
          for_each: "{{ devices_info | selectattr('is_apple') | list }}"
          sequence:
            - service: "{{ repeat.item.service_name }}"

              data:
                message: "clear_notification"
                data:
                  tag: "{{ tag }}"

  ##############################
  # Return user response
  ##############################
  - stop: "Script stopped."

    response_variable: "user_response"
