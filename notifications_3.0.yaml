      name: 1️⃣ Button 1
      icon: mdi:gesture-tap-button
      description: Configure Button 1 and its optional iOS styling.
      collapsed: true
      input:
        confirm_enabled:
          name: Show Button 1
          description: Hide or show this action button. On Android, buttons with Link mode open the link instead of sending a response event.
          default: true
          selector:
            boolean: {}
        confirm_text:
          name: Button 1 label
          description: Text shown on the first action button.
          default: Option 1
          selector:
            text:
              multiline: false
              multiple: false
        confirm_option_mode:
          name: Button 1 mode
          description: "Android can run either Home Assistant action(s) or open a link from a button, not both. Choose Actions and leave its action list empty for a button that only returns a response. iOS can run configured actions and a link. See [actionable notifications](https://companion.home-assistant.io/docs/notifications/actionable-notifications)."
          default: ''
          selector:
            select:
              mode: dropdown
              options:
                - label: ''
                  value: ''
                - label: Action(s)
                  value: action
                - label: "Link (Android only)"
                  value: uri
        confirm_action:
          name: Button 1 actions
          description: "Actions to run after this button responds. Leave empty to return the selected button without running actions."
          default: []
          selector:
            action: {}
        confirm_uri:
          name: Button 1 link
          description: "Optional button link. Android button links do not send a response event and do not stop the timeout countdown. Examples and supported URI schemes: [Companion URL documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic#opening-a-url)."
          default: ''
          selector:
            text:
              type: url
              multiline: false
              multiple: false
        confirm_icon:
          name: iOS SF Symbol icon
          description: "Optional iOS SF Symbol, for example `sfsymbols:bell`. See [action icon values](https://companion.home-assistant.io/docs/notifications/actionable-notifications#icon-values). iOS only."
          default: ''
          selector:
            text:
