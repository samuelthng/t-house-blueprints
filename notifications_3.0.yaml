# v3.0: Multi-device first-responder notifications.
# Send replaces a matching notification ID; Clear dismisses it.
# First responder wins; other devices are cleared and informed of who handled it.
mode: parallel
max: 20
blueprint:
  name: "🔔 Notifications (Version 3.0.0 Beta - Multi-Device)"
  source_url: https://raw.githubusercontent.com/samuelthng/t-house-blueprints/refs/heads/v3.0.0-beta-1/notifications_3.0.yaml
  homeassistant:
    min_version: 2024.6.0
  domain: script
  author: samuelthng/t-house-blueprints
  description: |
    # 🔔 Notifications — Version 3.0.0 Beta

    [🔗 Blueprint source](https://github.com/samuelthng/t-house-blueprints/blob/main/notifications_3.0.yaml) · [📱 Companion notification docs](https://companion.home-assistant.io/docs/notifications/notifications-basic)

    Send or clear Companion notifications. A matching ID replaces the visible notification; response waiting is a separate choice.

    ## ✨ Features

    📱 Companion phones · 🔘 Up to 3 buttons (action, link, text reply, snooze) · ⌛ Response wait and timeout · 🔁 Reminders · 📣 Follow-up · 🚨 Alarm volume and iOS critical alerts · 📎 Camera (with snapshot), image, video, audio, and iOS map content

    ## 🔄 What happens

    📤 **Send** · Sends or replaces a notification. Choose separately whether to wait.

    🧹 **Clear** · Dismisses the notification with the matching ID.

    🏷️ **Notification ID** · Reuse an ID to replace or clear. A blank ID is unique per run. A new Send or Clear with the same ID supersedes the earlier wait globally and clears its old recipients.

    ⌛ **Wait** · A button, Android dismissal, timeout, or matching replacement can end the wait. iOS critical notifications do not support normal replacement or clearing.

    ## 🚀 Quick start

    1. 📱 **Pick your phones** under **Who to notify** (each needs the Companion app and notifications allowed).
    2. 📝 **Add a title and message**, then run the script. A first test with no buttons or timeout is the easiest check.
    3. 🔘 **Add buttons and a timeout** only after the plain notification arrives.
    4. 🍎 **iOS:** press and hold (or swipe and tap **View**) a notification to see its buttons.

    <details>
    <summary>🛠️ No notification, or no buttons? Check this first</summary>
    <ul>
      <li>📲 Open the Companion app → <strong>Settings → Companion app → Notifications</strong> and confirm push works (try <strong>Send test notification</strong>).</li>
      <li>🔔 Allow notifications for the app in your phone's system settings. Disable battery optimisation for the app on Android.</li>
      <li>🎯 Make sure the selected device is the phone you are holding. Re-select it after reinstalling the app or changing phones.</li>
      <li>🌙 Focus / Do Not Disturb can hide notifications. On Android, an existing channel keeps its old sound and importance; try a new channel name.</li>
      <li>🔘 Buttons on iOS only show after press-and-hold or expanding the notification.</li>
      <li>🖼️ Attachments missing? The phone must be able to fetch the URL. Set <strong>Base URL for attachments</strong> to your external URL (for example <code>https://ha.example.com</code>) and check the camera or image entity is available.</li>
      <li>💬 Reply or Snooze button missing? Turn on <strong>Wait for a response</strong>; they are hidden when the script does not wait.</li>
      <li>🔍 Still stuck? Look in <strong>Settings → System → Logs</strong> for errors from this script, and in <strong>Developer tools → Actions</strong> test the phone's <code>notify.mobile_app_…</code> action directly.</li>
    </ul>
    </details>

    ## 🔁 Reminders, snooze and reply

    These only work while the script waits for a response. With waiting off, Text reply and Snooze buttons are hidden (link buttons stay) and reminders are skipped.

    - 🔁 **Reminders** send the notification again until someone answers, always before the timeout and never more than the maximum.
    - 😴 **Snooze** (a button mode) clears every phone, waits, then sends again. The timeout restarts after each snooze. The button disappears after the last allowed snooze.
    - 💬 **Text reply** (a button mode) returns the typed text as `reply_text`.
    - 👆 **Swipe-away as snooze** (Android) makes a swipe behave like Snooze. Without it, a swipe counts as an answer and stops reminders.
    - 🚨 **Alarm volume** (Android) and **Critical** (iOS) take priority over Quiet delivery. iOS critical alerts cannot be replaced or cleared, so reminders stack and snooze cannot clear them.

    ## 📱 Platform guide

    - 🍎 **iOS:** SF Symbol, destructive styling, and unlock controls live inside each button's own iOS section. Interruption level has its own section.
    - 🏷️ **iOS delivery tags:** Tags exceeding Apple's 64-byte limit are deterministically hashed after adding device suffixes. Reuse the original Notification ID to replace or clear; shorter tags and Android tags are unchanged.
    - 🤖 **Android:** Notification icon/color, channel and priority, lock-screen visibility, Android Auto, and swipe/dismiss behavior are grouped under **Android options** and **Android dismissal**.
    - ⚠️ **Button links:** Android buttons choose either Actions or Link. A link tap does not stop the response timeout countdown.
    - 🔗 **Link examples:** Home Assistant views can use paths such as `/lovelace/my-dashboard`; web pages use `https://…`. Android also supports app/deep links; see the [Companion URL documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic#opening-a-url). iOS URL schemes depend on the target app.

    ## 📣 Multi-device behavior

    The first button response resolves the wait. The caller receives a structured result. Optional follow-up actions can run after a response, timeout, or dismissal. Two optional follow-up notifications can be sent after a button response, each with its own enable switch: one for the phone that responded and one for every other selected phone.

    ## 🧩 Reuse this instance safely

    Call with `field_reset_config: true` to ignore all saved notification settings
    and disable every saved button, timeout, swipe, and follow-up action. Apply
    presentation/delivery overrides through `field_configuration` using blueprint
    input names, or the individual runtime fields. Explicit empty values clear
    saved content. Reset affects only this call, not the saved instance.

    Saved YAML action sequences cannot be replaced by templated action lists;
    reset disables them entirely. An instance-level run-mode override still
    applies: use Parallel for simultaneous independent notification IDs.

    <details>
    <summary>Expand/collapse follow-up variables and examples</summary>
    <ul>
      <li><strong>Complete result:</strong> <code>user_response</code>, <code>response_with_responder</code></li>
      <li><strong>Offered choices:</strong> <code>response_options</code></li>
      <li><strong>Typed reply:</strong> <code>reply_text</code>, <code>response_reply_text</code></li>
      <li><strong>Outcome:</strong> <code>response_action</code>, <code>response_outcome</code>, <code>response_action_id</code>, <code>response_button_index</code>, <code>response_button_title</code></li>
      <li><strong>Event details:</strong> <code>response_event_data</code></li>
      <li><strong>Responder:</strong> <code>responder_name</code>, <code>responder_device_id</code>, <code>responder_device</code>, <code>response_device_platform</code>, <code>response_device_is_ios</code></li>
      <li><strong>Recipients:</strong> <code>response_devices</code>, <code>response_recipients</code>, <code>response_recipient_ids</code>, <code>non_responder_devices</code>, <code>non_responder_device_ids</code>, <code>non_responder_device_names</code></li>
      <li><strong>Run context:</strong> <code>response_notification_id</code>, <code>response_caller_context</code></li>
    </ul>
    <p><strong>Example action template:</strong></p>
    <pre><code>message: "{{ responder_name }} chose {{ response_button_title }}. Outcome: {{ response_outcome }}."</code></pre>
    <p><code>response_device_is_ios</code> is true or false when a responder is identified; otherwise it is empty. Platform classification uses device metadata and the notification payload branch.</p>
    </details>
