        option_three_icon:
          name: iOS SF Symbol icon
          description: "Optional iOS SF Symbol, for example `sfsymbols:bell`. See [action icon values](https://companion.home-assistant.io/docs/notifications/actionable-notifications#icon-values). iOS only."
          default: ''
          selector:
            text:
              prefix: 'sfsymbols:'
              multiline: false
              multiple: false
        option_three_is_destructive:
