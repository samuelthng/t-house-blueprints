  variables:
    script_operation_mode: "{{ runtime_config.operation_mode }}"
    operation_mode: '{{ iif(field_operation_mode is defined, field_operation_mode, script_operation_mode) }}'
    script_wait_for_response: "{{ runtime_config.wait_for_response }}"
    wait_for_response: '{{ iif(field_wait_for_response is defined, field_wait_for_response, script_wait_for_response) }}'
    caller_context: '{{ field_caller_context if field_caller_context is defined else {} }}'
    expect_response: >-
      {{ wait_for_response and operation_mode == "send" }}
- alias: Device Configuration
  variables:
    devices: >
      {% set source = field_notify_devices if field_notify_devices is defined else runtime_config.notify_devices %}
      {% set ns = namespace(items=[]) %}
      {% for device in source %}
        {% set manufacturer = device_attr(device, 'manufacturer') or '' %}
        {% set model = device_attr(device, 'model') or '' %}
        {% set platform = 'ios' if 'apple' in manufacturer | lower else 'android' %}
        {% set raw_notify_tag = tag ~ '-' ~ (device_attr(device, 'name') | slugify) %}
        {% set raw_handled_tag = tag ~ '-handled' %}
        {% set notify_tag = (raw_notify_tag | sha256) if platform == 'ios' and raw_notify_tag.encode('utf-8') | length > 64 else raw_notify_tag %}
        {% set handled_tag = (raw_handled_tag | sha256) if platform == 'ios' and raw_handled_tag.encode('utf-8') | length > 64 else raw_handled_tag %}
        {% set ns.items = ns.items + [{'id': device, 'slug': (device_attr(device, 'name') | slugify), 'name': device_attr(device, 'name'), 'manufacturer': manufacturer, 'model': model, 'platform': platform, 'platform_source': 'device_registry_manufacturer; non-Apple uses the Android payload branch', 'platform_evidence': {'manufacturer': manufacturer, 'model': model}, 'notify_service': 'notify.mobile_app_' ~ (device_attr(device, 'name') | slugify), 'notify_tag': notify_tag, 'handled_tag': handled_tag}] %}
      {% endfor %}
      {{ ns.items }}
- if:
  - condition: template
    value_template: "{{ devices | length == 0 }}"
  then:
  - stop: "No devices selected."
    error: false
- alias: Reminders, snooze and reply
  variables:
    reminder_enabled: "{{ runtime_config.get('reminder_enabled', false) | bool(false) }}"
    reminder_interval_config: "{{ runtime_config.get('reminder_interval', {}) }}"
    reminder_interval_seconds: "{{ [reminder_interval_config.get('days', 0) * 86400 + reminder_interval_config.get('hours', 0) * 3600 + reminder_interval_config.get('minutes', 0) * 60 + reminder_interval_config.get('seconds', 0), 30] | max }}"
    reminder_max_count: "{{ [[runtime_config.get('reminder_max_count', 3) | int(3), 1] | max, 20] | min }}"
    reminder_title_prefix: "{{ runtime_config.get('reminder_title_prefix', '') | string | trim }}"
    reminders_allowed: >-
      {% if not expect_response or not reminder_enabled %}0{% elif enable_timeout %}{{ [[reminder_max_count, (timeout_seconds - 1) // reminder_interval_seconds] | min, 0] | max }}{% else %}{{ reminder_max_count }}{% endif %}
    snooze_config: "{{ runtime_config.get('snooze_duration', {}) }}"
    snooze_seconds: "{{ [snooze_config.get('days', 0) * 86400 + snooze_config.get('hours', 0) * 3600 + snooze_config.get('minutes', 0) * 60 + snooze_config.get('seconds', 0), 10] | max }}"
    snooze_max_count: "{{ [[runtime_config.get('snooze_max_count', 3) | int(3), 1] | max, 10] | min }}"
    reply_placeholder: "{{ runtime_config.get('reply_placeholder', '') | string }}"
    reply_submit_label: "{{ runtime_config.get('reply_submit_label', 'Send') | string }}"
    swipe_as_snooze: "{{ runtime_config.get('swipe_as_snooze', false) | bool(false) }}"
- alias: Take a camera snapshot to attach
  variables:
    snapshot_ready: false
    snapshot_version: ""
    snapshot_camera: "{{ runtime_config.get('attachment_camera_entity', '') or '' }}"
    snapshot_name: "{{ snapshot_camera | replace('.', '_') ~ '.jpg' }}"
    snapshot_wanted: >-
      {{ operation_mode == 'send' and runtime_config.get('attachment_type', 'none') == 'camera_entity' and (runtime_config.get('attachment_camera_snapshot', false) | bool(false)) and snapshot_camera | length > 0 and states(snapshot_camera) not in ['unavailable', 'unknown'] }}
- if:
  - condition: template
    value_template: "{{ snapshot_wanted }}"
  then:
  - alias: Save a snapshot to Home Assistant media
    service: camera.snapshot
    continue_on_error: true
    target:
      entity_id: "{{ snapshot_camera }}"
    data:
      filename: "/media/notification_snapshots/{{ snapshot_name }}"
  - alias: Use the snapshot as the attachment
    variables:
      snapshot_ready: true
      snapshot_version: "{{ now().timestamp() | int }}"
- alias: Attachments
  variables:
    attachment_type: "{{ runtime_config.attachment_type }}"
    attachment_camera_entity: "{{ runtime_config.attachment_camera_entity }}"
    attachment_image_entity: "{{ runtime_config.attachment_image_entity }}"
    attachment_media: "{{ runtime_config.attachment_media }}"
    media_content_id: "{{ attachment_media.get('media_content_id', '') }}"
    media_content_type: "{{ attachment_media.get('media_content_type', '') }}"
    selected_media_url: >-
      {{ (media_content_id | replace('media-source://media_source/local/', '/media/local/') if media_content_id.startswith('media-source://media_source/local/') else media_content_id if media_content_id.startswith(('http://', 'https://', '/media/local/', '/local/')) else '') | trim }}
    media_kind: >-
      {% set mime = media_content_type | lower %}
      {% set source = media_content_id | lower %}
      {{ ('image' if mime.startswith('image/') or source.endswith(('.jpg', '.jpeg', '.png', '.gif')) else 'video' if mime.startswith('video/') or source.endswith(('.mp4', '.mpeg', '.mpg', '.avi')) else 'audio' if mime.startswith('audio/') or source.endswith(('.mp3', '.wav', '.aiff', '.m4a')) else '') | trim }}
    attachment_base_url: "{{ (runtime_config.get('attachment_base_url', '') or '') | string | trim }}"
    camera_picture: >-
      {{ (state_attr(attachment_camera_entity, 'entity_picture') or '') | string | trim if attachment_camera_entity | length else '' }}
    camera_image_url: >-
      {{ ('/media/local/notification_snapshots/' ~ snapshot_name ~ '?v=' ~ snapshot_version) if snapshot_ready else ((camera_picture if camera_picture | length else '/api/camera_proxy/' ~ attachment_camera_entity) if attachment_camera_entity | length else '') }}
    relative_media_url: >-
      {{ (camera_image_url if attachment_type == 'camera_entity' else '/api/image_proxy/' ~ attachment_image_entity if attachment_type == 'image_entity' and attachment_image_entity | length else selected_media_url) | trim }}
    media_url: >-
      {{ (attachment_base_url.rstrip('/') ~ relative_media_url) if attachment_base_url | length and relative_media_url.startswith('/') else relative_media_url }}
    map_pin_one_entity: "{{ runtime_config.map_pin_one_entity }}"
    map_pin_one_location: "{{ runtime_config.map_pin_one_location }}"
    map_pin_one_latitude: >-
      {{ (state_attr(map_pin_one_entity, 'latitude') if map_pin_one_entity and state_attr(map_pin_one_entity, 'latitude') is not none else map_pin_one_location.get('latitude', '')) | string | trim }}
    map_pin_one_longitude: >-
      {{ (state_attr(map_pin_one_entity, 'longitude') if map_pin_one_entity and state_attr(map_pin_one_entity, 'longitude') is not none else map_pin_one_location.get('longitude', '')) | string | trim }}
    map_second_pin_enabled: "{{ runtime_config.map_second_pin_enabled }}"
    map_pin_two_entity: "{{ runtime_config.map_pin_two_entity }}"
    map_pin_two_location: "{{ runtime_config.map_pin_two_location }}"
    map_pin_two_latitude: >-
      {{ (state_attr(map_pin_two_entity, 'latitude') if map_pin_two_entity and state_attr(map_pin_two_entity, 'latitude') is not none else map_pin_two_location.get('latitude', '')) | string | trim }}
    map_pin_two_longitude: >-
      {{ (state_attr(map_pin_two_entity, 'longitude') if map_pin_two_entity and state_attr(map_pin_two_entity, 'longitude') is not none else map_pin_two_location.get('longitude', '')) | string | trim }}
    map_shows_line: "{{ runtime_config.map_shows_line }}"
- alias: Option 1
  variables:
    first_option: "{{ 'FIRST_' ~ notification_run_id }}"
    script_option_one_enabled: "{{ runtime_config.confirm_enabled }}"
    option_one_enabled: '{{ iif(field_option_one_enabled is defined, field_option_one_enabled, script_option_one_enabled) }}'
    script_option_one_title: "{{ runtime_config.confirm_text }}"
    option_one_title: '{{ iif(field_option_one_text is defined, field_option_one_text, script_option_one_title) }}'
    option_one_mode: "{{ runtime_config.confirm_option_mode }}"
    option_one_uri: "{{ runtime_config.confirm_uri }}"
    option_one_icon_value: "{{ runtime_config.confirm_icon }}"
    option_one_icon: '{% if ''sfsymbols:'' in option_one_icon_value %} {{ option_one_icon_value }} {% elif option_one_icon_value | length %} {{ "sfsymbols:{icon}".format(icon=option_one_icon_value) }} {%- endif %}'
    option_one_is_destructive: "{{ runtime_config.confirm_is_destructive }}"
    option_one_auth_required: "{{ runtime_config.confirm_authentication_required }}"
    option_one_action: '{% if option_one_mode == ''uri'' %} {{ ''URI'' }} {% else %} {{ first_option }} {% endif %}'
    option_one: >-
      {% set o = {'enabled': option_one_enabled, 'action': option_one_action, 'title': option_one_title, 'icon': option_one_icon, 'destructive': option_one_is_destructive, 'authenticationRequired': option_one_auth_required} %}
      {% if option_one_mode == 'reply' %}{% set o = dict(o, behavior='textInput', textInputButtonTitle=reply_submit_label, textInputPlaceholder=reply_placeholder) %}{% elif option_one_uri | length and option_one_mode != 'snooze' %}{% set o = dict(o, uri=option_one_uri) %}{% endif %}
      {{ o }}
- alias: Option 2
  variables:
    second_option: "{{ 'SECOND_' ~ notification_run_id }}"
    script_option_two_enabled: "{{ runtime_config.dismiss_enabled }}"
    option_two_enabled: '{{ iif(field_option_two_enabled is defined, field_option_two_enabled, script_option_two_enabled) }}'
    script_option_two_title: "{{ runtime_config.dismiss_text }}"
    option_two_title: '{{ iif(field_option_two_text is defined, field_option_two_text, script_option_two_title) }}'
    option_two_mode: "{{ runtime_config.dismiss_option_mode }}"
    option_two_uri: "{{ runtime_config.dismiss_uri }}"
    option_two_icon_value: "{{ runtime_config.dismiss_icon }}"
    option_two_icon: '{% if ''sfsymbols:'' in option_two_icon_value %} {{ option_two_icon_value }} {% elif option_two_icon_value | length %} {{ "sfsymbols:{icon}".format(icon=option_two_icon_value) }} {%- endif %}'
    option_two_is_destructive: "{{ runtime_config.dismiss_is_destructive }}"
    option_two_auth_required: "{{ runtime_config.dismiss_authentication_required }}"
    option_two_action: '{% if option_two_mode == ''uri'' %} {{ ''URI'' }} {% else %} {{ second_option }} {% endif %}'
    option_two: >-
      {% set o = {'enabled': option_two_enabled, 'action': option_two_action, 'title': option_two_title, 'icon': option_two_icon, 'destructive': option_two_is_destructive, 'authenticationRequired': option_two_auth_required} %}
      {% if option_two_mode == 'reply' %}{% set o = dict(o, behavior='textInput', textInputButtonTitle=reply_submit_label, textInputPlaceholder=reply_placeholder) %}{% elif option_two_uri | length and option_two_mode != 'snooze' %}{% set o = dict(o, uri=option_two_uri) %}{% endif %}
      {{ o }}
- alias: Option 3
  variables:
    third_option: "{{ 'THIRD_' ~ notification_run_id }}"
    script_option_three_enabled: "{{ runtime_config.option_three_enabled }}"
    option_three_enabled: '{{ iif(field_option_three_enabled is defined, field_option_three_enabled, script_option_three_enabled) }}'
    script_option_three_title: "{{ runtime_config.option_three_text }}"
    option_three_title: '{{ iif(field_option_three_text is defined, field_option_three_text, script_option_three_title) }}'
    option_three_mode: "{{ runtime_config.option_three_option_mode }}"
    option_three_uri: "{{ runtime_config.option_three_uri }}"
    option_three_icon_value: "{{ runtime_config.option_three_icon }}"
    option_three_icon: '{% if ''sfsymbols:'' in option_three_icon_value %} {{ option_three_icon_value }} {% elif option_three_icon_value | length %} {{ "sfsymbols:{icon}".format(icon=option_three_icon_value) }} {%- endif %}'
    option_three_is_destructive: "{{ runtime_config.option_three_is_destructive }}"
    option_three_auth_required: "{{ runtime_config.option_three_authentication_required }}"
    option_three_action: '{% if option_three_mode == ''uri'' %} {{ ''URI'' }} {% else %} {{ third_option }} {% endif %}'
    option_three: >-
      {% set o = {'enabled': option_three_enabled, 'action': option_three_action, 'title': option_three_title, 'icon': option_three_icon, 'destructive': option_three_is_destructive, 'authenticationRequired': option_three_auth_required} %}
      {% if option_three_mode == 'reply' %}{% set o = dict(o, behavior='textInput', textInputButtonTitle=reply_submit_label, textInputPlaceholder=reply_placeholder) %}{% elif option_three_uri | length and option_three_mode != 'snooze' %}{% set o = dict(o, uri=option_three_uri) %}{% endif %}
      {{ o }}
- alias: Setup Payload
  variables:
    options: "{{ [option_one, option_two, option_three] | selectattr('enabled') | list }}"
    notification_data: >-
      {% set payload = namespace(data={}) %}
      {% set payload.data = dict(payload.data, **{ 'actions': options }) %}
      {% set payload.data = dict(payload.data, **{ 'tag': tag }) %}
      {% if group|length %}{% set payload.data = dict(payload.data, **{ 'group': group }) %}{% endif %}
      {{ payload.data }}
    apple_payload_extras: >-
      {% set extras = namespace(data={}) %}
      {% set extras.data = dict(extras.data, **{ 'subtitle': subtitle }) %}
      {% set push = namespace(d={}) %}
      {% set push.d = dict(push.d, **{ 'interruption-level': interruption_level }) %}
      {% if interruption_level == 'critical' %}{% set push.d = dict(push.d, **{ 'sound': ios_critical_sound }) %}{% endif %}
      {% if notification_link|length %}{% set extras.data = dict(extras.data, **{ 'url': notification_link }) %}{% endif %}
      {% if attachment_type == 'camera_entity' and not snapshot_ready %}{% set extras.data = dict(extras.data, **{ 'entity_id': attachment_camera_entity }) %}{% endif %}
      {% if attachment_type == 'camera_entity' and snapshot_ready and media_url|length %}{% set extras.data = dict(extras.data, **{ 'image': media_url }) %}{% endif %}
      {% if attachment_type == 'map' and map_pin_one_latitude|length and map_pin_one_longitude|length %}
        {% set map_data = namespace(value={'latitude': map_pin_one_latitude, 'longitude': map_pin_one_longitude}) %}
        {% if map_second_pin_enabled and map_pin_two_latitude|length and map_pin_two_longitude|length %}{% set map_data.value = dict(map_data.value, **{'second_latitude': map_pin_two_latitude, 'second_longitude': map_pin_two_longitude, 'shows_line_between_points': map_shows_line}) %}{% endif %}
        {% set extras.data = dict(extras.data, **{ 'action_data': map_data.value }) %}
      {% endif %}
      {% if attachment_type == 'media' and media_url|length and media_kind == 'image' %}{% set extras.data = dict(extras.data, **{ 'image': media_url }) %}{% endif %}
      {% if attachment_type == 'media' and media_url|length and media_kind == 'video' %}{% set extras.data = dict(extras.data, **{ 'video': media_url }) %}{% endif %}
      {% if attachment_type == 'media' and media_url|length and media_kind == 'audio' %}{% set extras.data = dict(extras.data, **{ 'audio': media_url }) %}{% endif %}
      {% if attachment_type == 'image_entity' and media_url|length %}{% set extras.data = dict(extras.data, **{ 'image': media_url }) %}{% endif %}
      {% set extras.data = dict(extras.data, **{ 'push': push.d }) %}
      {{ extras.data }}
    android_payload_extras: >-
      {% set extras = namespace(data={}) %}
      {% set extras.data = dict(extras.data, **{ 'subject': subtitle }) %}
      {% set extras.data = dict(extras.data, **{ 'visibility': visibility }) %}
      {% set extras.data = dict(extras.data, **{ 'importance': importance }) %}
      {% if android_priority_high %}{% set extras.data = dict(extras.data, **{ 'priority': 'high', 'ttl': 0 }) %}{% endif %}
      {% if notification_link|length %}{% set extras.data = dict(extras.data, **{ 'clickAction': notification_link }) %}{% endif %}
      {% if attachment_type == 'camera_entity' and (media_url|length) %}{% set extras.data = dict(extras.data, **{ 'image': media_url }) %}{% endif %}
      {% if attachment_type == 'image_entity' and media_url|length %}{% set extras.data = dict(extras.data, **{ 'image': media_url }) %}{% endif %}
      {% if attachment_type == 'media' and media_url|length and media_kind in ['image', 'video'] %}{% set extras.data = dict(extras.data, **{ media_kind: media_url }) %}{% endif %}
      {% if notification_icon|length %}{% set extras.data = dict(extras.data, **{ 'notification_icon': notification_icon }) %}{% endif %}
      {% if enable_icon_color %}{% set extras.data = dict(extras.data, **{ 'color': icon_color_hex }) %}{% endif %}
      {% if enable_timeout and clear_on_timeout %}{% set extras.data = dict(extras.data, **{ 'timeout': timeout_seconds }) %}{% endif %}
      {% if android_channel|length %}{% set extras.data = dict(extras.data, **{ 'channel': android_channel }) %}{% endif %}
      {% if persist %}{% set extras.data = dict(extras.data, **{ 'persistent': persist }) %}{% endif %}
      {% if car_ui %}{% set extras.data = dict(extras.data, **{ 'car_ui': car_ui }) %}{% endif %}
      {{ extras.data }}
- if:
  - condition: template
    value_template: '{{ operation_mode == "clear" and custom_tag | length == 0 }}'
  then:
  - stop: "A Notification ID is required to clear a notification."
    error: false
- if:
  - condition: template
    value_template: '{{ operation_mode == "send" and attachment_type == "media" and (media_url | length == 0 or media_kind | length == 0) }}'
  then:
  - stop: "The selected media source cannot be converted to a Companion-accessible image, video, or audio URL. Choose Home Assistant local media."
    error: true
- if:
  - condition: template
    value_template: '{{ operation_mode == "send" and attachment_type == "map" and (map_pin_one_latitude | length == 0 or map_pin_one_longitude | length == 0) }}'
  then:
  - stop: "For a map, choose a valid location entity or select Pin 1 on the map. The entity must have latitude and longitude attributes."
    error: true
- if:
  - condition: template
    value_template: '{{ operation_mode == "send" and attachment_type == "map" and map_second_pin_enabled and (map_pin_two_latitude | length == 0 or map_pin_two_longitude | length == 0) }}'
  then:
  - stop: "The second map pin is enabled but has no valid location. Choose a location entity or select Pin 2 on the map."
    error: true
- if:
  - condition: template
    value_template: '{{ custom_tag | length > 0 and operation_mode in ["send", "clear"] }}'
  then:
  - alias: Supersede any older run with this ID
    event: blueprint_notification_superseded
    event_data:
      notification_id: '{{ custom_tag }}'
      recipients: '{{ devices | map(attribute="id") | list }}'
- alias: Delivery state
  variables:
    snooze_count: 0
    sends_total: 0
    reminders_total: 0
    delivery_finished: false
    wait_finished: false
    wait_event: null
    window_started: 0
    window_sends: 0
    snoozes_left: 0
    is_reminder: false
    remaining_seconds: 0
    send_title: "{{ title }}"
    send_options: []
- alias: Send, wait, remind and snooze
  repeat:
    until: "{{ delivery_finished }}"
    sequence:
    - alias: Start a new wait window
      variables:
        window_started: "{{ now().timestamp() }}"
        window_sends: 0
        wait_finished: false
        wait_event: null
        is_reminder: false
        first_option: "{{ 'FIRST_' ~ notification_run_id ~ '_' ~ snooze_count }}"
        second_option: "{{ 'SECOND_' ~ notification_run_id ~ '_' ~ snooze_count }}"
        third_option: "{{ 'THIRD_' ~ notification_run_id ~ '_' ~ snooze_count }}"
        option_one: "{{ option_one if option_one.action == 'URI' else dict(option_one, action=first_option) }}"
        option_two: "{{ option_two if option_two.action == 'URI' else dict(option_two, action=second_option) }}"
        option_three: "{{ option_three if option_three.action == 'URI' else dict(option_three, action=third_option) }}"
        options: "{{ [option_one, option_two, option_three] | selectattr('enabled') | list }}"
        snoozes_left: "{{ [snooze_max_count - snooze_count, 0] | max }}"
        send_options: >-
          {% set ns = namespace(items=[]) %}
          {% for o, m in [(option_one, option_one_mode), (option_two, option_two_mode), (option_three, option_three_mode)] %}
            {% if o.enabled and (expect_response or o.get('uri')) and (m != 'snooze' or snoozes_left | int > 0) %}{% set ns.items = ns.items + [o] %}{% endif %}
          {% endfor %}
          {{ ns.items }}
    - alias: Wait for a response while sending and reminding
      parallel:
      - alias: Wait for a response
        sequence:
        - if:
          - condition: template
            value_template: "{{ expect_response }}"
          then:
          - choose:
            - alias: Should await response with timeout?
              conditions: '{{ enable_timeout }}'
              sequence:
              - alias: Awaiting response with timeout…
                wait_for_trigger:
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: '{{ first_option }}'
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: '{{ second_option }}'
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: '{{ third_option }}'
                - platform: event
                  event_type: mobile_app_notification_cleared
                  event_data:
                    action_1_key: '{{ first_option }}'
                - platform: event
                  event_type: mobile_app_notification_cleared
                  event_data:
                    action_2_key: '{{ second_option }}'
                - platform: event
                  event_type: mobile_app_notification_cleared
                  event_data:
                    action_3_key: '{{ third_option }}'
                - platform: event
                  event_type: blueprint_notification_superseded
                  event_data:
                    notification_id: '{{ custom_tag }}'
                timeout: '{{ timeout }}'
                continue_on_timeout: true
            - alias: Should await response indefinitely?
              conditions: '{{ enable_timeout == false }}'
              sequence:
              - alias: Awaiting response indefinitely…
                wait_for_trigger:
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: '{{ first_option }}'
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: '{{ second_option }}'
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: '{{ third_option }}'
                - platform: event
                  event_type: mobile_app_notification_cleared
                  event_data:
                    action_1_key: '{{ first_option }}'
                - platform: event
                  event_type: mobile_app_notification_cleared
                  event_data:
                    action_2_key: '{{ second_option }}'
                - platform: event
                  event_type: mobile_app_notification_cleared
                  event_data:
                    action_3_key: '{{ third_option }}'
                - platform: event
                  event_type: blueprint_notification_superseded
                  event_data:
                    notification_id: '{{ custom_tag }}'
          - alias: Remember how the wait ended
            variables:
              wait_event: >-
                {% set e = wait.trigger.event if wait is defined and wait.trigger is defined and wait.trigger else none %}
                {{ {'event_type': e.event_type, 'data': (e.data | to_json | from_json)} if e is not none else none }}
              wait_finished: true
          - alias: Tell the reminder loop to stop
            event: blueprint_notification_wait_over
            event_data:
              run_id: "{{ notification_run_id }}"
      - alias: Send now and remind later
        sequence:
        - repeat:
            while: "{{ not wait_finished and window_sends <= reminders_allowed }}"
            sequence:
            - if:
              - condition: template
                value_template: "{{ window_sends > 0 }}"
              then:
              - alias: Wait for the next reminder
                wait_for_trigger:
                - platform: event
                  event_type: blueprint_notification_wait_over
                  event_data:
                    run_id: "{{ notification_run_id }}"
                timeout:
                  seconds: "{{ reminder_interval_seconds }}"
                continue_on_timeout: true
            - if:
              - condition: template
                value_template: "{{ not wait_finished }}"
              then:
              - alias: Prepare this send
                variables:
                  is_reminder: "{{ window_sends > 0 }}"
                  window_sends: "{{ window_sends + 1 }}"
                  sends_total: "{{ sends_total + 1 }}"
                  reminders_total: "{{ reminders_total + (1 if is_reminder else 0) }}"
                  remaining_seconds: "{{ [timeout_seconds - ((now().timestamp() - window_started) | int), 1] | max }}"
                  send_title: "{{ ((reminder_title_prefix ~ ' ' ~ title) | trim) if is_reminder and reminder_title_prefix | length else title }}"
              - alias: Send notification to all devices (first responder wins)
                repeat:
                  for_each: "{{ devices }}"
                  sequence:
                  - alias: Resolve per-device payload
                    variables:
                      device_tag: '{{ repeat.item.notify_tag }}'
                      device_is_apple: "{{ 'APPLE' in (device_attr(repeat.item.id, 'manufacturer')|upper) }}"
                      device_payload: >-
                        {% set extras = apple_payload_extras if device_is_apple else android_payload_extras %}
                        {% set d = (notification_data | combine(extras) | combine({'tag': device_tag, 'actions': send_options})) %}
                        {% if not device_is_apple and enable_timeout and clear_on_timeout %}
                          {% set d = d | combine({'timeout': remaining_seconds}) %}
                        {% endif %}
                        {% if device_is_apple %}
                          {% set action_data = d.get('action_data', {}) | combine({'responder_device_id': repeat.item.id}) %}
                          {% set d = d | combine({'action_data': action_data}) %}
                        {% endif %}
                        {% set device_loud = (interruption_level == 'critical') if device_is_apple else alarm_stream_active %}
                        {% if not expect_response and silent_update and not device_loud %}
                          {% set d = (d | combine({'silent': true, 'alert_once': true})) %}
                        {% endif %}
                        {{ d }}
                  - choose:
                    - alias: Clear tagged notification (operation_mode=clear)
                      conditions: '{{ operation_mode == ''clear'' }}'
                      sequence:
                      - alias: Send clear command to device
                        service: '{{ repeat.item.notify_service }}'
                        continue_on_error: true
                        data:
                          message: clear_notification
                          data:
                            tag: '{{ device_tag }}'
                    default:
                    - alias: Send standard or status notification
                      service: '{{ repeat.item.notify_service }}'
                      continue_on_error: true
                      data:
                        title: '{{ send_title }}'
                        message: '{{ message }}'
                        data: '{{ device_payload }}'
    - alias: Work out whether a snooze button ended the wait
      variables:
        snooze_pressed: >-
          {% set e = wait_event if wait_event else none %}
          {% set a = e.data.action if e is not none and e.event_type == 'mobile_app_notification_action' and e.data.action is defined else '' %}
          {% set swiped = e is not none and e.event_type == 'mobile_app_notification_cleared' and swipe_as_snooze and not (persist | bool(false)) %}
          {{ expect_response and snoozes_left | int > 0 and (swiped or (a | length > 0 and ((a == first_option and option_one_mode == 'snooze' and option_one_enabled) or (a == second_option and option_two_mode == 'snooze' and option_two_enabled) or (a == third_option and option_three_mode == 'snooze' and option_three_enabled)))) }}
    - if:
      - condition: template
        value_template: "{{ snooze_pressed }}"
      then:
      - alias: Clear the notification on every phone while snoozed
        repeat:
          for_each: "{{ devices }}"
          sequence:
          - alias: Clear on this phone
            service: "{{ repeat.item.notify_service }}"
            continue_on_error: true
            data:
              message: clear_notification
              data: >-
                {{ {'tag': repeat.item.notify_tag} | combine(android_delivery_extras if repeat.item.platform == 'android' else {}) }}
      - alias: Snoozed (a new send with the same ID ends the snooze)
        wait_for_trigger:
        - platform: event
          event_type: blueprint_notification_superseded
          event_data:
            notification_id: '{{ custom_tag }}'
        timeout:
          seconds: "{{ snooze_seconds }}"
        continue_on_timeout: true
      - alias: Count the snooze and decide what happens next
        variables:
          snooze_count: "{{ snooze_count + 1 }}"
          wait_event: >-
            {% set e = wait.trigger.event if wait is defined and wait.trigger is defined and wait.trigger else none %}
            {{ {'event_type': e.event_type, 'data': (e.data | to_json | from_json)} if e is not none else none }}
          delivery_finished: "{{ wait_event is not none }}"
      else:
      - alias: Nothing to snooze, finish
        variables:
          delivery_finished: true
- alias: Parse response into variable
  variables:
    user_response: >-
      {% set event = wait_event if wait_event else none %}
      {% set outcome = 'cleared' if operation_mode == 'clear' else 'not_waited' if not expect_response else 'timeout' if event is none else 'superseded' if event.event_type == 'blueprint_notification_superseded' else 'dismissed' if event.event_type == 'mobile_app_notification_cleared' else 'button' %}
      {% set result = 'no_response' if outcome == 'not_waited' else 'cleared' if outcome == 'cleared' else 'superseded' if outcome == 'superseded' else 'timeout' if outcome == 'timeout' else 'swiped' if outcome == 'dismissed' and not persist|bool else 'notification_cleared' if outcome == 'dismissed' else 'option_one' if event.data.action == option_one['action'] else 'option_two' if event.data.action == option_two['action'] else 'option_three' if event.data.action == option_three['action'] else 'unknown' %}
       {% set response = namespace(data={'schema_version': 2, 'result': result, 'outcome': outcome, 'payload': notification_data, 'options': options, 'devices': devices, 'notification': {'id': custom_tag if custom_tag|length else tag, 'run_id': notification_run_id, 'context_id': context.id, 'group': group, 'recipients': devices | map(attribute='name') | list, 'recipient_ids': devices | map(attribute='id') | list}, 'response': {}, 'caller_context': caller_context, 'delivery': {'sends': sends_total, 'reminders': reminders_total, 'snoozes': snooze_count}}) %}
      {% if event is not none %}
        {% set response.data = dict(response.data, **{'response': {'event_type': event.event_type, 'event_data': event.data}}) %}
      {% endif %}
      {% if outcome == 'button' %}
        {% set button = option_one if result == 'option_one' else option_two if result == 'option_two' else option_three %}
        {% set button_index = 1 if result == 'option_one' else 2 if result == 'option_two' else 3 %}
        {% set response.data = dict(response.data, **{'response': dict(response.data.response, **{'button_index': button_index, 'button_title': button.title, 'action_id': event.data.action, 'reply_text': event.data.get('reply_text', '') | string})}) %}
      {% endif %}
      {{ response.data }}
    reply_text: "{{ user_response.response.get('reply_text', '') }}"
- alias: Run response actions
  default: []
  choose:
  - alias: 'Trigger: Timeout'
    conditions: "{{ not reset_config and user_response.result == 'timeout' and run_timeout_actions | bool }}"
    sequence: !input timeout_action
  - alias: 'Trigger: Notification Cleared'
    conditions: "{{ not reset_config and user_response.result == 'notification_cleared' }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ not persist|bool and bind_swipe_to_timeout|bool and not swipe_action_set|bool and run_timeout_actions|bool }}'
      then: !input timeout_action
  - alias: 'Trigger: Swiped'
    conditions: "{{ not reset_config and user_response.result == 'swiped' }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ not persist|bool and swipe_action_set|bool }}'
      then: !input swipe_away_action
    - if:
      - condition: template
        value_template: '{{ not persist|bool and bind_swipe_to_timeout|bool and run_timeout_actions|bool }}'
      then: !input timeout_action
  - alias: 'Trigger: first_option'
    conditions: "{{ not reset_config and field_run_button_actions | default(true) | bool and user_response.result == 'option_one' }}"
    sequence: !input confirm_action
  - alias: 'Trigger: second_option'
    conditions: "{{ not reset_config and field_run_button_actions | default(true) | bool and user_response.result == 'option_two' }}"
    sequence: !input dismiss_action
  - alias: 'Trigger: third_option'
    conditions: "{{ not reset_config and field_run_button_actions | default(true) | bool and user_response.result == 'option_three' }}"
    sequence: !input option_three_action
- alias: Resolve responder name
  variables:
    responder_device_id: >-
      {% set event = wait_event if wait_event else none %}
      {% set event_id = event.data.device_id if event is not none and event.data is defined and event.data.device_id is defined else '' %}
      {% set action_data = event.data.action_data if event is not none and event.data is defined and event.data.action_data is defined else {} %}
      {% set action_id = action_data.get('responder_device_id', '') %}
      {% set event_tag = event.data.tag if event is not none and event.data is defined and event.data.tag is defined else '' %}
      {% set matched = (devices | selectattr('notify_tag', 'equalto', event_tag) | first | default({})) if event_tag else {} %}
      {{ event_id or action_id or (matched.id if matched else '') }}
    responder_name: >-
      {% set responder = devices | selectattr('id', 'equalto', responder_device_id) | first | default({}) %}
      {{ responder.name if responder else '' }}
    responder_device: >-
      {{ (devices | selectattr('id', 'equalto', responder_device_id) | first | default({})) if responder_device_id else {} }}
    responder_platform: "{{ responder_device.platform if responder_device else 'unknown' }}"
    responder_is_ios: "{{ responder_platform == 'ios' if responder_device else none }}"
- alias: Prepare follow-up variables
  variables:
    response_action: '{{ user_response.result }}'
    response_outcome: '{{ user_response.outcome }}'
    response_action_id: "{{ user_response.response.get('action_id', '') }}"
    response_button_index: "{{ user_response.response.get('button_index', 0) }}"
    response_button_title: "{{ user_response.response.get('button_title', '') }}"
    response_event_data: "{{ user_response.response.get('event_data', {}) }}"
    response_reply_text: "{{ reply_text }}"
    response_options: "{{ user_response.options }}"
    response_devices: "{{ user_response.devices }}"
    response_recipients: "{{ user_response.notification.recipients }}"
    response_recipient_ids: "{{ user_response.notification.recipient_ids }}"
    response_notification_id: "{{ user_response.notification.id }}"
    response_caller_context: "{{ user_response.caller_context }}"
    response_device_platform: "{{ responder_platform }}"
    response_device_is_ios: "{{ responder_is_ios }}"
- alias: Identify non-responder devices
  variables:
    non_responder_devices: >-
      {% set ns = namespace(items=[]) %}
      {% for device in devices %}
        {% if response_action not in ['option_one', 'option_two', 'option_three'] or not responder_device_id or device.id != responder_device_id %}
          {% set ns.items = ns.items + [device] %}
        {% endif %}
      {% endfor %}
      {{ ns.items }}
    non_responder_device_ids: "{{ non_responder_devices | map(attribute='id') | list }}"
    non_responder_device_names: "{{ non_responder_devices | map(attribute='name') | list }}"
- alias: Add responder to response
  variables:
    outcome: "{{ user_response.outcome }}"
    result: "{{ user_response.result }}"
    button_title: "{{ response_button_title }}"
    notification_id: '{{ custom_tag if custom_tag|length else tag }}'
    response_with_responder: >-
      {{ dict(user_response, **{'response': dict(user_response.response, **{'responder_name': responder_name, 'responder_device_id': responder_device_id, 'responder_device': responder_device, 'device_platform': responder_platform, 'device_is_ios': responder_is_ios, 'non_responder_devices': non_responder_devices, 'non_responder_device_ids': non_responder_device_ids, 'non_responder_device_names': non_responder_device_names})}) }}
- alias: Evaluate saved responder title only after response variables exist
  if:
    - condition: template
      value_template: "{{ not reset_config and field_broadcast_responder_title is not defined and 'broadcast_responder_title' not in (field_configuration | default({})) }}"
  then:
    - variables:
        saved_broadcast_responder_title: !input broadcast_responder_title
- alias: Evaluate saved responder message only after response variables exist
  if:
    - condition: template
      value_template: "{{ not reset_config and field_broadcast_responder_message is not defined and 'broadcast_responder_message' not in (field_configuration | default({})) }}"
  then:
    - variables:
        saved_broadcast_responder_message: !input broadcast_responder_message
- alias: Evaluate saved non-responder title only after response variables exist
  if:
    - condition: template
      value_template: "{{ not reset_config and field_broadcast_non_responder_title is not defined and 'broadcast_non_responder_title' not in (field_configuration | default({})) }}"
  then:
    - variables:
        saved_broadcast_non_responder_title: !input broadcast_non_responder_title
- alias: Evaluate saved non-responder message only after response variables exist
  if:
    - condition: template
      value_template: "{{ not reset_config and field_broadcast_non_responder_message is not defined and 'broadcast_non_responder_message' not in (field_configuration | default({})) }}"
  then:
    - variables:
        saved_broadcast_non_responder_message: !input broadcast_non_responder_message
- alias: Broadcast configuration
  variables:
    script_broadcast_responder_enabled: "{{ runtime_config.broadcast_responder_enabled }}"
    broadcast_responder_enabled: "{{ field_broadcast_responder_enabled if field_broadcast_responder_enabled is defined else field_broadcast_enabled if field_broadcast_enabled is defined else script_broadcast_responder_enabled }}"
    script_broadcast_non_responder_enabled: "{{ runtime_config.broadcast_non_responder_enabled }}"
    broadcast_non_responder_enabled: "{{ field_broadcast_non_responder_enabled if field_broadcast_non_responder_enabled is defined else field_broadcast_enabled if field_broadcast_enabled is defined else script_broadcast_non_responder_enabled }}"
    script_broadcast_responder_title: "{{ runtime_config.broadcast_responder_title if reset_config or 'broadcast_responder_title' in (field_configuration | default({})) else saved_broadcast_responder_title }}"
    broadcast_responder_title: "{{ field_broadcast_responder_title if field_broadcast_responder_title is defined else script_broadcast_responder_title }}"
    script_broadcast_responder_message: "{{ runtime_config.broadcast_responder_message if reset_config or 'broadcast_responder_message' in (field_configuration | default({})) else saved_broadcast_responder_message }}"
    broadcast_responder_message: "{{ field_broadcast_responder_message if field_broadcast_responder_message is defined else script_broadcast_responder_message }}"
    script_broadcast_non_responder_title: "{{ runtime_config.broadcast_non_responder_title if reset_config or 'broadcast_non_responder_title' in (field_configuration | default({})) else saved_broadcast_non_responder_title }}"
    broadcast_non_responder_title: "{{ field_broadcast_non_responder_title if field_broadcast_non_responder_title is defined else script_broadcast_non_responder_title }}"
    script_broadcast_non_responder_message: "{{ runtime_config.broadcast_non_responder_message if reset_config or 'broadcast_non_responder_message' in (field_configuration | default({})) else saved_broadcast_non_responder_message }}"
    broadcast_non_responder_message: "{{ field_broadcast_non_responder_message if field_broadcast_non_responder_message is defined else script_broadcast_non_responder_message }}"
    script_broadcast_clear_delay: "{{ runtime_config.broadcast_clear_delay }}"
    broadcast_clear_delay_seconds: >-
      {% set d = field_broadcast_clear_delay if field_broadcast_clear_delay is defined else script_broadcast_clear_delay %}
      {{ d.get('days', 0) * 86400 + d.get('hours', 0) * 3600 + d.get('minutes', 0) * 60 + d.get('seconds', 0) }}
- if:
  - condition: template
    value_template: "{{ not reset_config and field_run_followup_actions | default(true) | bool and expect_response and user_response.outcome in ['button', 'timeout', 'dismissed'] }}"
  then: !input followup_actions
- if:
  - condition: template
    value_template: '{{ operation_mode == "send" and expect_response }}'
  then:
  - alias: Clear original notifications (cross-device)
    repeat:
      for_each: "{{ devices }}"
      sequence:
      - alias: Clear original notification on this device
        if:
        - condition: template
          value_template: >-
            {{ user_response.outcome != 'superseded' or repeat.item.id not in user_response.response.event_data.recipients }}
        then:
        - service: "{{ repeat.item.notify_service }}"
          continue_on_error: true
          data:
            message: clear_notification
            data: >-
              {{ {'tag': repeat.item.notify_tag} | combine(android_delivery_extras if repeat.item.platform == 'android' else {}) }}
  - if:
    - condition: template
      value_template: "{{ (broadcast_responder_enabled or broadcast_non_responder_enabled) and user_response.outcome == 'button' }}"
    then:
    - alias: Send responder and non-responder follow-ups
      repeat:
        for_each: "{{ devices }}"
        sequence:
        - alias: Pick the wording for this device
          variables:
            is_responder: "{{ responder_device_id | length > 0 and repeat.item.id == responder_device_id }}"
            followup_title_template: "{{ broadcast_responder_title if is_responder else broadcast_non_responder_title }}"
            followup_message_template: "{{ broadcast_responder_message if is_responder else broadcast_non_responder_message }}"
            followup_title: "{{ followup_title_template | replace('{{ responder_name }}', responder_name) | replace('{{ outcome }}', user_response.outcome) | replace('{{ result }}', user_response.result) | replace('{{ notification_id }}', notification_id) | replace('{{ button_title }}', button_title) | replace('{{ reply_text }}', reply_text) }}"
            followup_message: "{{ followup_message_template | replace('{{ responder_name }}', responder_name) | replace('{{ outcome }}', user_response.outcome) | replace('{{ result }}', user_response.result) | replace('{{ notification_id }}', notification_id) | replace('{{ button_title }}', button_title) | replace('{{ reply_text }}', reply_text) }}"
        - alias: Skip this device when its follow-up is off or has no text
          if:
          - condition: template
            value_template: "{{ (broadcast_responder_enabled if is_responder else broadcast_non_responder_enabled) and (followup_title | string | length) + (followup_message | string | length) > 0 }}"
          then:
          - alias: Send follow-up to this device
            service: "{{ repeat.item.notify_service }}"
            continue_on_error: true
            data:
              title: "{{ followup_title }}"
              message: "{{ followup_message }}"
              data: >-
                {{ {'tag': repeat.item.handled_tag} | combine(android_delivery_extras if repeat.item.platform == 'android' else {}) }}
    - if:
      - condition: template
        value_template: "{{ broadcast_clear_delay_seconds | int > 0 }}"
      then:
      - alias: Wait before clearing the broadcast
        delay:
          seconds: "{{ broadcast_clear_delay_seconds }}"
      - alias: Clear the broadcast follow-up
        repeat:
          for_each: "{{ devices }}"
          sequence:
          - alias: Clear handled-by notification on this device
            service: "{{ repeat.item.notify_service }}"
            continue_on_error: true
            data:
              message: clear_notification
              data: >-
                {{ {'tag': repeat.item.handled_tag} | combine(android_delivery_extras if repeat.item.platform == 'android' else {}) }}
- stop: Script stopped.
  response_variable: response_with_responder
