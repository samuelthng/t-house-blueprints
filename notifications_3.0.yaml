        swipe_action_set: "{{ swipe_away_action | length > 0 }}"
- alias: Merge clean defaults and explicit runtime overrides
  variables:
    clean_config: >-
      {{ dict(saved_config, title='', subtitle='', message='', notification_link='',
        notify_devices=[], confirm_enabled=true, confirm_text='Option 1',
        confirm_option_mode='action', confirm_uri='', confirm_icon='',
        confirm_is_destructive=false, confirm_authentication_required=false,
        dismiss_enabled=true, dismiss_text='Option 2', dismiss_option_mode='action',
        dismiss_uri='', dismiss_icon='', dismiss_is_destructive=false,
        dismiss_authentication_required=false, option_three_enabled=false,
        option_three_text='Option 3', option_three_option_mode='action',
        option_three_uri='', option_three_icon='', option_three_is_destructive=false,
        option_three_authentication_required=false, interruption_level='active',
        icon='', enable_icon_color=false, icon_color=[102, 186, 240], channel='General',
        importance='default', android_high_priority=true, visibility='private',
        car_ui=false, enable_timeout=true, wait_for_response=true,
        timeout={'hours': 0, 'minutes': 15, 'seconds': 0}, run_timeout_actions=false,
        clear_on_timeout=false, persist=false, bind_swipe_to_timeout=false,
        broadcast_responder_enabled=false, broadcast_non_responder_enabled=false,
        broadcast_responder_title='You handled it',
        broadcast_responder_message='You chose {{ button_title }}.',
        broadcast_non_responder_title='Notification handled',
        broadcast_non_responder_message='{{ responder_name }} chose {{ button_title }}.',
        broadcast_clear_delay={'hours': 0, 'minutes': 0, 'seconds': 0},
        attachment_type='none', attachment_camera_entity='', attachment_base_url='', attachment_media={},
        attachment_image_entity='', map_pin_one_entity='', map_pin_one_location={},
        map_second_pin_enabled=false, map_pin_two_entity='', map_pin_two_location={},
        map_shows_line=false, operation_mode='send', tag='', group='', silent_update=false,
        ios_critical_volume=100, android_sound_stream='normal', reminder_enabled=false,
        reminder_interval={'hours': 0, 'minutes': 5, 'seconds': 0}, reminder_max_count=3,
        reminder_title_prefix='🔁', snooze_duration={'hours': 0, 'minutes': 10, 'seconds': 0},
        snooze_max_count=3, reply_placeholder='Type your reply', reply_submit_label='Send',
        attachment_camera_snapshot=false, swipe_as_snooze=false) }}
    runtime_config: >-
      {{ (clean_config if reset_config else saved_config)
        | combine(field_configuration | default({})) }}
- alias: Basic Notification Content
  variables:
    script_title: "{{ runtime_config.title }}"
    title: '{{ iif(field_title is defined, field_title, script_title) }}'
    script_subtitle: "{{ runtime_config.subtitle }}"
    subtitle: '{{ iif(field_subtitle is defined, field_subtitle, script_subtitle) }}'
    script_message: "{{ runtime_config.message }}"
    message: "{{ field_message if field_message is defined else script_message }}"
- alias: Common Configuration Options
  variables:
    script_notification_link: "{{ runtime_config.notification_link }}"
    notification_link: '{{ iif(field_notification_link is defined, field_notification_link, script_notification_link) }}'
    script_tag: "{{ runtime_config.tag }}"
    custom_tag: "{{ field_tag if field_tag is defined else script_tag }}"
    tag: "{{ custom_tag if custom_tag | length else this.entity_id ~ '-' ~ notification_run_id }}"
    group: "{{ runtime_config.group }}"
    silent_update: "{{ (field_silent_update if field_silent_update is defined else runtime_config.silent_update) | bool }}"
- alias: Android Configuration Options
  variables:
    channel: "{{ runtime_config.channel }}"
    visibility: "{{ runtime_config.visibility }}"
    importance: "{{ runtime_config.importance }}"
    script_persist: "{{ runtime_config.persist }}"
    persist: '{{ iif(field_persist is defined, field_persist, script_persist) }}'
    car_ui: "{{ runtime_config.car_ui }}"
    notification_icon: "{{ runtime_config.icon }}"
    enable_icon_color: "{{ runtime_config.enable_icon_color }}"
    icon_color_selector: "{{ runtime_config.icon_color }}"
    icon_color_hex: '{{ "#{:02x}{:02x}{:02x}".format(icon_color_selector[0], icon_color_selector[1], icon_color_selector[2]) }}'
    android_high_priority: "{{ runtime_config.android_high_priority }}"
    android_sound_stream: "{{ runtime_config.get('android_sound_stream', 'normal') }}"
    alarm_stream_active: "{{ android_sound_stream == 'alarm' }}"
    android_priority_high: "{{ android_high_priority | bool(false) or alarm_stream_active }}"
    android_channel: "{{ 'alarm_stream' if alarm_stream_active else channel }}"
    android_delivery_extras: "{{ {'priority': 'high', 'ttl': 0} if android_priority_high else {} }}"
- alias: iOS Configuration Options
  variables:
    interruption_level: "{{ runtime_config.interruption_level }}"
    ios_critical_volume: "{{ ([[runtime_config.get('ios_critical_volume', 100) | float(100), 0] | max, 100] | min) / 100 }}"
    ios_critical_sound: "{{ {'name': 'default', 'critical': 1, 'volume': ios_critical_volume | round(2)} if interruption_level == 'critical' else {} }}"
- alias: Timeout
  variables:
    script_enable_timeout: "{{ runtime_config.enable_timeout }}"
    enable_timeout: '{{ iif(field_enable_timeout is defined, field_enable_timeout, script_enable_timeout) }}'
    clear_on_timeout: "{{ runtime_config.clear_on_timeout }}"
    script_timeout: "{{ runtime_config.timeout }}"
    timeout: '{{ iif(field_timeout is defined, field_timeout, script_timeout) }}'
    timeout_seconds: "{{ timeout.get('days', 0) * 86400 + timeout.get('hours', 0) * 3600 + timeout.get('minutes', 0) * 60 + timeout.get('seconds', 0) }}"
    script_run_timeout_actions: "{{ runtime_config.run_timeout_actions }}"
    run_timeout_actions: '{{ iif(field_run_timeout_actions is defined, field_run_timeout_actions, script_run_timeout_actions) }}'
    script_bind_swipe_to_timeout: "{{ runtime_config.bind_swipe_to_timeout }}"
    bind_swipe_to_timeout: '{{ iif(field_bind_swipe_to_timeout is defined, field_bind_swipe_to_timeout, script_bind_swipe_to_timeout) }}'
