    reminders:
      name: 🔁 Reminders, snooze and reply
      icon: mdi:bell-ring
      description: |
        Extras for notifications that wait for a response. Turn on **Wait for a response** first.

        - 🔁 **Reminders** send the notification again every interval until someone answers, up to the maximum, and always before the timeout.
        - 😴 **Snooze** is a button mode. Tapping it clears the notification on every phone, waits, then sends it again. The timeout starts over after each snooze, and the Snooze button disappears after the last allowed snooze.
        - 💬 **Text reply** is a button mode. The typed text comes back as `reply_text`.
        - 👆 **Swipe-away as snooze** (Android, in the Android dismissal section) makes a swipe behave like Snooze.
        - 🍎 iOS critical alerts cannot be replaced, so reminders stack and snooze cannot clear them.
